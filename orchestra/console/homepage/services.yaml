# Orchestra 控制台 widget 配置。所有 widget 指向本机 glue serve（http://127.0.0.1:3100）。
- 今天:
    - 日历:
        widget:
          type: calendar
          view: agenda
          maxEvents: 15
          showTime: true
          previousDays: 3
          timezone: Asia/Shanghai
          integrations:
            - type: ical
              url: http://127.0.0.1:3100/system.ics
              name: 系统
              color: blue
            - type: ical
              url: http://127.0.0.1:3100/personal.ics
              name: 个人
              color: green
    - 状态条:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/status.json
          refreshInterval: 30000
          display: block
          mappings:
            - field: "4b"
              label: 4B
            - field: walnut
              label: 核桃派
            - field: windows
              label: Windows
            - field: queue_len
              label: 队列卡数
            - field: active_tasks
              label: 活动任务
            - field: next.0.label
              label: 下一触发
            - field: next.0.at
              label: 下一触发时间
            - field: next.0.in_text
              label: 倒计时
            - field: next.1.label
              label: 再下一
            - field: next.1.in_text
              label: 倒计时
            - field: next.2.label
              label: 再再下一
            - field: next.2.in_text
              label: 倒计时
    - 留言:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/messages.json
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            items: latest
            name: title
            label: time_text
            limit: 5
    - 留言全文:
        widget:
          type: iframe
          src: http://127.0.0.1:3100/messages.html
          classes: h-56
          refreshInterval: 30000
    - 待决:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/messages.json
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            items: pending
            name: title
            label: text
            limit: 5
    - 告警:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/messages.json
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            items: alerts
            name: title
            label: text
            limit: 5
- 雷达:
    - 阶段时间线:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/radar.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: stages
            name: name
            label: status
            limit: 10
    - Top5:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/radar.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: top5
            name: title
            label: total
            limit: 5
    - 日报全文:
        widget:
          type: iframe
          src: http://127.0.0.1:3100/digest.html
          classes: h-[24rem]
          refreshInterval: 300000
- 任务实验:
    - 最近任务:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/status.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: recent_tasks
            name: slug
            label: status
            limit: 8
    - 最近 attempt:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/status.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: attempts
            name: task
            label: status
            limit: 10
    - 实验卡:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/status.json
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: experiments.cards
            name: id
            label: status
            limit: 10
- 系统:
    - 系统状态:
        widget:
          type: customapi
          url: http://127.0.0.1:3100/status.json
          refreshInterval: 60000
          display: block
          mappings:
            - field: "4b"
              label: 4B
            - field: walnut
              label: 核桃派
            - field: windows
              label: Windows
            - field: next.0.label
              label: 下一触发
            - field: next.0.at
              label: 下一触发时间
            - field: next.0.in_text
              label: 倒计时
            - field: next.1.label
              label: 再下一
            - field: next.1.in_text
              label: 倒计时
            - field: next.2.label
              label: 再再下一
            - field: next.2.in_text
              label: 倒计时
            - field: generated_text
              label: 数据生成
            - field: last_task
              label: 最近任务
            - field: last_sync_text
              label: 上次同步
            - field: degraded_reason
              label: 降级说明
