<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchestra 控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <div class="livebar" id="livebar" aria-label="三端状态"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">Research Orchestra</div>
          <div class="brand-sub">控制台 · 个人日程可编</div>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="页面">
        <button type="button" class="tab is-active" data-tab="today" role="tab" aria-selected="true">今天</button>
        <button type="button" class="tab" data-tab="radar" role="tab" aria-selected="false">雷达</button>
        <button type="button" class="tab" data-tab="tasks" role="tab" aria-selected="false">任务实验</button>
        <button type="button" class="tab" data-tab="system" role="tab" aria-selected="false">系统</button>
      </nav>
      <div class="topbar-meta">
        <span id="clock" class="mono time">—</span>
        <button type="button" id="btn-refresh" class="btn-ghost" title="立即重载数据">刷新</button>
      </div>
    </header>

    <div id="banner" class="banner hidden" role="status"></div>
    <div id="soon" class="soon hidden" aria-label="临近日程"></div>

    <main>
      <section id="page-today" class="page is-active" role="tabpanel">
        <div class="pulse pulse-ops" id="pulse"></div>
        <div class="grid-today">
          <section class="panel agenda-panel">
            <header class="panel-head">
              <h2 class="panel-title">日程</h2>
              <span id="agenda-status" class="hint">点月历某天添加 · 卡片可改日期</span>
            </header>
            <div id="agenda" class="agenda"></div>
          </section>
          <section class="panel month-panel">
            <header class="panel-head">
              <h2 class="panel-title">月历</h2>
              <span class="month-nav">
                <button type="button" id="month-prev" class="btn-tiny" aria-label="上月">‹</button>
                <span id="month-label" class="mono time">—</span>
                <button type="button" id="month-next" class="btn-tiny" aria-label="下月">›</button>
              </span>
            </header>
            <div id="cal-month" class="month"></div>
            <p class="hint month-hint">点某一天：左侧打开那天，可写新事项或把卡片拖过去。卡片上也能改日期。绿/橙/红只标未完成个人事项。</p>
          </section>
          <div class="board-msgs">
            <section class="panel">
              <header class="panel-head">
                <h2 class="panel-title">留言</h2>
                <span id="msg-count" class="chip muted">0</span>
              </header>
              <div id="messages-latest" class="msg-list"></div>
            </section>
            <section class="panel tone-pending">
              <header class="panel-head">
                <h2 class="panel-title">待决</h2>
                <span id="pending-count" class="chip pending">0</span>
              </header>
              <form id="pending-composer" class="pending-composer">
                <label class="pending-label" for="pending-input">写下要你拍板的事</label>
                <div class="pending-row">
                  <input id="pending-input" type="text" name="text" maxlength="200" autocomplete="off" placeholder="例如：宿舍主机买不买" />
                  <button type="button" id="pending-add" class="pending-add">写入</button>
                </div>
                <p id="pending-status" class="hint pending-hint">写好后点「写入」。只有待决能「撤掉」；留言和告警是系统刷的，刷新还会回来。</p>
              </form>
              <div id="messages-pending" class="msg-list"></div>
            </section>
            <section class="panel tone-alert">
              <header class="panel-head">
                <h2 class="panel-title">告警</h2>
                <span id="alert-count" class="chip alert">0</span>
              </header>
              <div id="messages-alerts" class="msg-list"></div>
            </section>
          </div>
        </div>
      </section>

      <section id="page-radar" class="page" role="tabpanel" hidden>
        <div class="radar-meta" id="radar-meta"></div>
        <div class="grid-radar">
          <div class="radar-left">
            <section class="panel">
              <header class="panel-head">
                <h2 class="panel-title">阶段时间线</h2>
              </header>
              <div id="radar-stages" class="stages"></div>
            </section>
            <section class="panel">
              <header class="panel-head">
                <h2 class="panel-title">往期日报</h2>
                <span class="hint">点击切换</span>
              </header>
              <div id="radar-history" class="history"></div>
            </section>
          </div>
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">Top5</h2>
              <span class="hint">五维总分 · 点标题/PDF 打开正文</span>
            </header>
            <div id="radar-top5" class="top5"></div>
          </section>
        </div>
        <section class="panel digest-panel">
          <header class="panel-head">
            <h2 class="panel-title">日报全文</h2>
          </header>
          <div id="radar-digest" class="digest"></div>
        </section>
      </section>

      <section id="page-tasks" class="page" role="tabpanel" hidden>
        <div class="pulse pulse-ops" id="tasks-pulse"></div>
        <div class="grid-tasks">
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">排队</h2>
              <span id="queued-count" class="chip muted">0</span>
            </header>
            <div id="tasks-queued" class="table"></div>
          </section>
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">运行中</h2>
              <span id="running-count" class="chip muted">0</span>
            </header>
            <div id="tasks-running" class="table"></div>
          </section>
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">完成</h2>
              <span id="done-count" class="chip muted">0</span>
            </header>
            <div id="tasks-done" class="table"></div>
          </section>
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">挂起</h2>
              <span id="hung-count" class="chip alert">0</span>
            </header>
            <div id="tasks-hung" class="table"></div>
          </section>
        </div>
        <section class="panel experiments-panel">
          <header class="panel-head">
            <h2 class="panel-title">实验卡</h2>
          </header>
          <div id="experiments" class="table"></div>
        </section>
      </section>

      <section id="page-system" class="page" role="tabpanel" hidden>
        <div id="devices" class="devices"></div>
        <div class="grid-system">
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">定时器下次触发</h2>
            </header>
            <div id="system-next" class="next-list"></div>
          </section>
          <section class="panel">
            <header class="panel-head">
              <h2 class="panel-title">数据新鲜度</h2>
            </header>
            <dl id="system-meta" class="meta-grid"></dl>
          </section>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>数据源 <span class="mono">127.0.0.1:3100</span></span>
      <span id="foot-gen" class="time">—</span>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
