# Academic Coursework — declarative loading manifest
# Self-contained 5-stage pipeline for course assignments (大作业/课程论文).
# All external skill dependencies extracted and frozen under skills-embedded/.
# Stage files reference local files, NOT Skill tool calls.

name: academic-coursework
version: "2.0"
description: Course assignment paper pipeline — topic to .docx delivery (auto/semi-auto modes + padding)

# ── Session Variables ──────────────────────────────
session_variables:
  output_dir:
    description: "Directory path for writing intermediate and final output files. Default base: ./paper_output_coursework"
    default: "./paper_output_coursework"
  paper_slug:
    description: "Per-paper unique identifier in format {YYYYMMDD_HHMMSS}_{english_slug}. Generated at pipeline start."
    default: null
  paper_dir:
    description: "Full per-paper output path = {output_dir_base}/{paper_slug}/"
    default: null
  pipeline_root:
    description: "Root directory of the coursework pipeline skill. Auto-detected at session start as the directory containing manifest.yaml."
    default: "."

# ── Axes ───────────────────────────────────────────
axes:
  entry_point:
    description: "How does the paper start?"
    values: [course-assignment, existing-manuscript]
    detect:
      course-assignment: "User mentions 大作业, 课程论文, 结课作业, 课程作业, or course assignment"
      existing-manuscript: "User provides an existing draft document"

  paperType:
    description: "Type of paper"
    values: [course-assignment]
    default: course-assignment

  mode:
    description: "Auto or semi-auto mode"
    values: [auto, semi-auto]
    default: auto
    detect:
      auto: "User requests 全自动, auto mode, one-click, 一键生成, or provides only a topic without asking for step-by-step"
      semi-auto: "User requests 半自动, step-by-step, manual mode, or explicitly wants to guide each step"

  language:
    description: "Working language"
    values: [zh]
    default: zh

  venue:
    description: "Target venue (not applicable for coursework)"
    values: [na]
    default: na

  discipline:
    description: "Academic discipline"
    values: [general, stem]
    default: general
    detect:
      stem: "User mentions CS, 计算机, engineering, or a STEM field"

  urgency:
    description: "Time pressure"
    values: [normal, emergency]
    default: normal


  writingFormat:
    description: "Target draft format for C3+"
    values: [word, latex, markdown, auto-detect]
    default: word
    detect:
      word: "User wants docx / Word / 默认大作业"
      latex: "User requests LaTeX / .tex / Overleaf for coursework"
      markdown: "User requests Markdown draft"

  stage:
    description: "Current active pipeline stage"
    values: [C1, C2, C3, C4, C5, C5.5]

# ── Embedded References ────────────────────────────
# Pipeline is SELF-CONTAINED. All external skill content extracted
# and frozen under skills-embedded/.
embedded_references:
  critical:
    - file: skills-embedded/paper-lookup.md
      stages: [C2]
      purpose: Multi-database literature search
    - file: skills-embedded/scientific-brainstorming.md
      stages: [C1]
      purpose: Idea generation and topic selection
  important:
    - file: skills-embedded/docx.md
      stages: [C3]
      purpose: python-docx reference (.docx generation)
    - file: skills-embedded/markdown-mermaid-writing.md
      stages: [C3]
      purpose: Mermaid diagram support
    - file: skills-embedded/latex-thesis-zh.md
      stages: [C3]
      purpose: Chinese LaTeX reference (optional)
  optional:
    - file: skills-embedded/generate-image.md
      stages: [C3]
      purpose: AI image generation
    - file: skills-embedded/pdf.md
      stages: [C5]
      purpose: PDF handling for review
    - file: skills-embedded/latex-paper-en.md
      stages: [C3, C5]
      purpose: LaTeX writing router to academic-latex (writingFormat=latex)
    - file: skills-embedded/nature-figure.md
      stages: [C3]
      purpose: Submission-grade figures via academic-plotting
    - file: skills-embedded/scientific-visualization.md
      stages: [C3]
      purpose: Data charts via academic-plotting
    - file: skills-embedded/scientific-schematics.md
      stages: [C3]
      purpose: Concept diagrams via academic-plotting
    - file: ../academic-latex/SKILL.md
      stages: [C3, C5]
      condition: {writingFormat: latex}
      purpose: Canonical LaTeX claim-evidence protocol
    - file: ../academic-plotting/SKILL.md
      stages: [C3]
      purpose: Canonical figure protocol
    - file: skills-embedded/latex-document-skill.md
      stages: [C3, C5]
      purpose: LaTeX compilation helpers
    - file: ../academic-shared/commands/check-refs.md
      stages: [C2, C5]
      purpose: /check-refs citation verification
    - file: ../academic-shared/commands/de-ai.md
      stages: [C5, C5.5]
      purpose: /de-ai rewrite command
    - file: ../academic-shared/commands/latex-cleanup.md
      stages: [C3, C5]
      condition: {writingFormat: latex}
      purpose: /latex-cleanup when writingFormat=latex

# ── Always Load ─────────────────────────────────────
# 22 core files defining pipeline rules
always_load:
  - static/core/convergence-loop.md
  - static/core/incremental-update.md
  - static/core/attention-defense.md
  - static/core/pipeline-rules.md
  - static/core/gate-chain.md
  - static/core/dispatch-points.md
  - static/core/context-budget.md
  - static/core/parallel-groups.md
  - static/core/result-collection.md
  - static/core/stop-and-ask.md
  - static/core/fallback.md
  - static/core/input-validation.md
  - static/core/exit-protocol.md
  - static/core/web-search-policy.md
  - static/core/paper-types.md
  - static/core/prerequisites.md
  - static/core/do-dont.md
  - static/core/session-persistence.md
  - static/core/stage-output-format.md
  - static/core/session-variables.md
  - static/core/multi-agent-patterns.md
  - static/core/material-passport.md
  - references/quick-routing.md

# ── On Demand: Strategists ──────────────────────────
strategists:
  C1:
    file: strategists/C1-strategist.md
    next: C2
    entry_point: course-assignment
  C2:
    file: strategists/C2-strategist.md
    next: C3
  C3:
    file: strategists/C3-strategist.md
    next: C4
  C4:
    file: strategists/C4-strategist.md
    next: C5
  C5:
    file: strategists/C5-strategist.md
    next: null  # terminal — convergence reached or hard cap
    note: "After C5 convergence, if user mentions keywords (padding/de-AI/plagiarism-check), proceed to C5.5 (hidden branch) instead of terminating. See C5.md for keyword detection logic."
  C5.5:
    file: strategists/C5.5-strategist.md
    next: null
    note: "Hidden branch — conditionally loaded by C5.md trigger only when user mentions keywords such as padding/de-AI/plagiarism-check after C5 convergence."

# ── On Demand: Composers ──────────────────────────
composers:
  - path: ../academic-shared/composers/evidence-ledger-gen.md
  - path: ../academic-shared/composers/docx-assembly.md
  - path: ../academic-shared/composers/format-routing.md
  - path: ../academic-shared/composers/citation-anchor-format.md
  - path: ../academic-shared/composers/claim-to-paragraph.md
  - path: ../academic-shared/composers/factual-accuracy-check.md
  - path: ../academic-shared/composers/de-ai-detect.md
  - path: ../academic-shared/composers/polish-protocols.md
  - path: ../academic-shared/composers/paper-audit-orchestration.md

# ── Dependency Graph ──────────────────────────────
dependency_graph:
  course-assignment: [C1, C2, C3, C4, C5]
  course-assignment-inflated: [C1, C2, C3, C4, C5, C5.5]
  existing-manuscript: [C4, C5]
  existing-manuscript-inflated: [C4, C5, C5.5]

# ── On Demand: References ───────────────────────────
references:
  chinese-de-ai-guide:
    file: references/chinese-de-ai-guide.md
    condition:
      stage: [C4]
    on_demand: true
  chinese-de-ai-quick-ref:
    file: references/chinese-de-ai-quick-ref.md
    condition:
      stage: [C4]
    on_demand: true
  common-mistakes:
    file: references/common-mistakes.md
    on_demand: true
  dependency-matrix:
    file: references/dependency-matrix.md
    on_demand: true
  feasibility-check:
    file: references/feasibility-check.md
    condition:
      stage: [C2]
  literature-verify:
    file: references/literature-verify.md
    condition:
      stage: [C2, C4]
  evidence-grade:
    file: references/evidence-grade.md
    condition:
      stage: [C2, C3]
  paraphrasing-patterns:
    file: references/paraphrasing-patterns.md
    condition:
      stage: [C5.5]
    on_demand: true
  playwright-browser-automation:
    file: references/playwright-browser-automation.md
    condition:
      stage: [C2]
    on_demand: true
  tavily-search:
    file: references/tavily-search.md
    condition:
      stage: [C2]
    on_demand: true

  # ── ROADMAP P2-3: commands ─────────────────────────────
  command-de-ai:
    file: ../academic-shared/commands/de-ai.md
    condition:
      stage: [C4]
    on_demand: true

  command-verify-math:
    file: ../academic-shared/commands/verify-math.md
    condition:
      stage: [C3]
    on_demand: true

  literature-search-tool:
    file: ../academic-shared/literature/literature_search.py
    condition:
      stage: [C2]
    on_demand: true

  verify-citations-tool:
    file: ../academic-shared/literature/verify_citations.py
    condition:
      stage: [C2]
    on_demand: true
