# academic-journal/evaluate/config/chinese_conference.yaml

id: chinese_conference
name: "中文会议评审：会议投稿/论文集/论坛发言"
version: "1.0.0"
language: zh
venue: chinese-conference
stage: S7
agent_dir: "academic-journal/evaluate/agents/chinese"

engine:
  scoring_script: "academic-shared/evaluate/scripts/scoring.py"
  aggregation: weighted_median
  scored_agent_runs: 3
  scoreless_agent_runs: 1
  high_variance_threshold: 15
  require_issue_severity_labels: true
  issue_severity_labels: [Critical, Major, Minor]
  median_score_policy: "use median of three scored runs; if max-min > high_variance_threshold, add HIGH_VARIANCE flag"

review_principles:
  default_stance: "层级校准审稿人——判断论文是否适合该会议，而非无差别批判"
  anti_flattery: false
  calibration: "中文会议允许篇幅较短和贡献较集中，但不能允许问题意识虚、方法不可查、结论过度外推。评分基于实际质量，不设问题数下限。"
  first_review_expectation: "每个 scored agent 基于论文实际质量发现和标记问题。若稿件确实达到可录用水平，如实评分即可。"

journalTier: D

tier_profile:
  D:
    label: "D：中文会议/论文集/论坛"
    target: "主题匹配、结构完整、观点清楚、证据基本可靠，适合会议交流。"
    min_overall_accept: 68
    no_dimension_below: 50

paper_type_profiles:
  empirical:
    emphasis: [methodology_design, data_analysis, conference_fit]
  literature-review:
    emphasis: [literature_context, structure_organization, logic_consistency]
  theory:
    emphasis: [theory_depth, logic_consistency, innovation_fit]
  registered-report:
    emphasis: [methodology_design, format_reference]
  data-paper:
    emphasis: [data_analysis, methodology_design]
  software-tool:
    emphasis: [methodology_design, innovation_fit, data_analysis]
  benchmark:
    emphasis: [methodology_design, data_analysis, literature_context]

# Weights sum to 1.00 for scored dimensions.
dimensions:
  - id: conference_fit
    name: "会议主题匹配与交流价值"
    weight: 0.14
    agents: [innovation_reviewer_zh]
    scored: true
    required: true
    rubric_override: "重点判断选题是否适合会议主题、分论坛范围、听众兴趣和短论文交流场景。"

  - id: problem_contribution
    name: "问题意识与核心观点"
    weight: 0.14
    agents: [content_reviewer_zh]
    scored: true
    required: true

  - id: literature_context
    name: "文献背景与研究定位"
    weight: 0.10
    agents: [literature_reviewer_zh]
    scored: true
    required: true

  - id: theory_or_framework
    name: "理论/分析框架清晰度"
    weight: 0.09
    agents: [theory_depth_reviewer_zh]
    scored: true
    required: false
    fallback_weight_to: logic_consistency

  - id: methodology_design
    name: "方法、材料或案例说明"
    weight: 0.13
    agents: [methodology_reviewer_zh]
    scored: true
    required: false
    applies_to: [empirical, registered-report, data-paper, software-tool, benchmark]
    fallback_weight_to: problem_contribution

  - id: data_analysis
    name: "证据、数据分析与结果呈现"
    weight: 0.11
    agents: [data_analysis_reviewer_zh]
    scored: true
    required: false
    applies_to: [empirical, data-paper, software-tool, benchmark]
    fallback_weight_to: problem_contribution

  - id: logic_consistency
    name: "论证逻辑与结论边界"
    weight: 0.12
    agents: [logic_consistency_zh]
    scored: true
    required: true

  - id: structure_organization
    name: "短文结构、摘要与报告可读性"
    weight: 0.08
    agents: [structure_reviewer_zh]
    scored: true
    required: true

  - id: format_reference
    name: "会议格式、图表与参考文献规范"
    weight: 0.05
    agents: [format_compliance_zh]
    scored: true
    required: true

  - id: academic_style
    name: "中文表达与报告友好度"
    weight: 0.04
    agents: [academic_style_reviewer_zh]
    scored: true
    required: true

  - id: ai_tone_translation_trace
    name: "AI 痕迹、翻译腔与模板化表达风险"
    weight: 0.00
    agents: [ai_tone_detector_zh]
    scored: false
    runs: 3
    output: risk_report

  - id: factual_reference_risk
    name: "事实准确性与引用可核查风险"
    weight: 0.00
    agents: [factual_accuracy_zh]
    scored: false
    runs: 1
    output: risk_report

  - id: first_review_synthesis
    name: "会议审稿问题清单综合"
    weight: 0.00
    agents: [first_review_synthesizer_zh]
    scored: false
    runs: 1
    output: revision_plan

grade_thresholds:
  accept_or_submit:
    min_overall: 75
    label: "可投稿/可录用概率较高，但仍需处理主要问题"
  borderline_minor_revision:
    min_overall: 68
    label: "边界稿，小修或定向压缩后可投"
  major_revision:
    min_overall: 58
    label: "需要大修后再投会议"
  reject_and_reframe:
    max_overall: 57
    label: "当前版本不适合投稿，需重设问题和结构"

gate_blockers:
  - id: off_topic
    name: "与会议主题/分论坛明显不匹配"
    severity: Critical
    action: block_submission
    triggered_by: [innovation_reviewer_zh, content_reviewer_zh]
  - id: no_clear_claim
    name: "没有清晰研究问题、核心观点或可交流贡献"
    severity: Critical
    action: cap_overall_at_60
    triggered_by: [content_reviewer_zh, logic_consistency_zh]
  - id: evidence_too_thin
    name: "证据或数据不足以支撑会议论文结论"
    severity: Major
    action: cap_overall_at_66
    triggered_by: [data_analysis_reviewer_zh, methodology_reviewer_zh]
  - id: severe_format_violation
    name: "超篇幅、模板错误、参考文献严重不规范"
    severity: Major
    action: require_format_revision
    triggered_by: [format_compliance_zh]
  - id: ai_template_heavy
    name: "AI 模板化表达严重，影响可信度与报告效果"
    severity: Major
    action: require_language_revision
    triggered_by: [ai_tone_detector_zh, academic_style_reviewer_zh]

coupling_rules:
  - id: conference_fit_caps_acceptance
    if: "conference_fit < 60"
    then: "overall <= 64"
    rationale: "会议论文首先必须匹配会议主题和听众。"
  - id: no_method_caps_empirical
    if: "paperType in [empirical, data-paper, benchmark] and methodology_design < 58"
    then: "overall <= 62"
    rationale: "实证/数据/基准类会议论文缺少方法说明时不可录用。"
  - id: weak_structure_hurts_short_paper
    if: "structure_organization < 60"
    then: "overall <= 68"
    rationale: "会议论文篇幅短，结构混乱会直接降低可交流性。"

convergence:
  max_rounds: 3
  converged_when:
    new_critical: 0
    new_major: "<= 1"
  degeneration_stop: true
  hard_limit_action: "报告剩余问题给作者，附带未解决问题的 caveat"

output_contract:
  scored_agent_must_include:
    - "Part 1: 问题清单，按 Critical/Major/Minor 分级"
    - "Part 2: 证据与原因，引用论文具体段落/句子/表格"
    - "Part 3: 修改方案，给出可执行改法"
    - "DIMENSION_SCORE: <0-100>"
  scoreless_agent_must_include:
    - "RISK_LEVEL: Low|Medium|High|Severe"
    - "EVIDENCE: 触发风险的原文片段或位置"
    - "FIX: 修改或核查建议"
