# academic-journal/evaluate/config/chinese_core.yaml

id: chinese_core
name: "中文期刊评审：中文核心/普刊投稿"
version: "1.0.0"
language: zh
venue: chinese-domestic
stage: S7
agent_dir: "academic-journal/evaluate/agents/chinese"

engine:
  scoring_script: "academic-shared/evaluate/scripts/scoring.py"
  aggregation: weighted_median
  scored_agent_runs: 3
  scoreless_agent_runs: 1
  high_variance_threshold: 15
  require_issue_severity_labels: true
  issue_severity_labels: [Critical, Major, Minor]
  median_score_policy: "use median of three scored runs; if max-min > high_variance_threshold, add HIGH_VARIANCE flag"

review_principles:
  default_stance: "层级校准审稿人——判断论文是否达到目标期刊的发表标准，而非无差别批判"
  anti_flattery: false
  calibration: "评分基于目标期刊层级的质量门槛。如果论文确实达标，不应为找问题而找问题；如果未达标，准确指出差距。"
  first_review_expectation: "每个 scored agent 基于论文实际质量发现和标记问题，不设问题数下限。Critical/Major 问题必须附原文证据和可执行修改方案。"
  evidence_standard: "所有判断必须回到论文文本、研究设计、证据链、文献脉络和目标期刊层级。"

# The config supports A/B/C domestic tiers through tier_profiles.
# Route supplies journalTier; if absent, use B1.
default_tier: B1

tier_profiles:
  A:
    label: "A 类：学科顶刊/权威期刊"
    target: "重大理论或经验贡献，国内外文献完整，方法与论证几乎无硬伤。"
    min_overall_submit: 85
    max_minor_ready: 3
    no_dimension_below: 72
    emphasis:
      innovation_fit: very_high
      theory_depth: very_high
      literature_context: very_high
      methodology_design: high
  B1:
    label: "B1：CSSCI 核心 + 北大核心"
    target: "问题意识清楚、文献扎实、方法规范、贡献明确。"
    min_overall_submit: 78
    max_minor_ready: 6
    no_dimension_below: 65
    emphasis:
      literature_context: high
      methodology_design: high
      format_reference: high
  B2:
    label: "B2：CSSCI 扩展版"
    target: "结构完整、论证扎实、有可见推进，允许创新幅度较小。"
    min_overall_submit: 74
    max_minor_ready: 8
    no_dimension_below: 62
  B3:
    label: "B3：CSCD 核心"
    target: "技术/数据/实验规范，结论可靠，文献与格式合规。"
    min_overall_submit: 74
    max_minor_ready: 8
    no_dimension_below: 62
    emphasis:
      methodology_design: very_high
      data_analysis: very_high
      format_reference: high
  C1:
    label: "C1：北大核心（非 CSSCI/CSCD）"
    target: "选题有价值、材料充分、结构规范、无明显硬伤。"
    min_overall_submit: 70
    max_minor_ready: 10
    no_dimension_below: 58
  C2:
    label: "C2：普通期刊"
    target: "结构完整、表达清楚、引用基本规范、没有事实/方法硬伤。"
    min_overall_submit: 65
    max_minor_ready: 12
    no_dimension_below: 52
  C3:
    label: "C3：入库/增刊/专刊"
    target: "可读、合规、无明显抄袭/造假/伦理风险。"
    min_overall_submit: 60
    max_minor_ready: 15
    no_dimension_below: 48

paper_type_profiles:
  empirical:
    must_run: [methodology_reviewer_zh, data_analysis_reviewer_zh]
    emphasis: [methodology_design, data_analysis, literature_context]
    critical_questions:
      - "样本、变量、模型或识别策略是否足以支持因果/相关结论？"
      - "稳健性、异质性、内生性或替代解释是否处理？"
  literature-review:
    emphasis: [literature_context, theory_depth, logic_consistency]
    critical_questions:
      - "是否只是资料罗列，而缺少批判性整合框架？"
      - "国内 CNKI/万方/核心期刊脉络是否完整？"
  theory:
    emphasis: [theory_depth, logic_consistency, innovation_fit]
    critical_questions:
      - "核心概念是否原创、清晰、可区分？"
      - "理论推演是否存在跳步、循环论证或概念偷换？"
  registered-report:
    emphasis: [methodology_design, logic_consistency, format_reference]
    critical_questions:
      - "预注册问题、假设、方法、样本量与分析计划是否锁定且可复现？"
  data-paper:
    emphasis: [data_analysis, methodology_design, format_reference]
    critical_questions:
      - "数据来源、清洗、字段说明、可获取性与复用价值是否充分？"
  software-tool:
    emphasis: [methodology_design, data_analysis, innovation_fit]
    critical_questions:
      - "工具是否有可复现实验、对比基线、使用边界与开源/部署说明？"
  benchmark:
    emphasis: [methodology_design, data_analysis, literature_context]
    critical_questions:
      - "基准是否代表真实任务，指标是否合理，是否覆盖强基线？"

# Weights sum to 1.00 for scored dimensions.
dimensions:
  - id: problem_contribution
    name: "问题意识与内容贡献"
    weight: 0.13
    agents: [content_reviewer_zh]
    scored: true
    required: true

  - id: literature_context
    name: "文献综述与国内外研究脉络"
    weight: 0.14
    agents: [literature_reviewer_zh]
    scored: true
    required: true

  - id: theory_depth
    name: "理论框架与概念深度"
    weight: 0.11
    agents: [theory_depth_reviewer_zh]
    scored: true
    required: true

  - id: methodology_design
    name: "研究设计与方法严谨性"
    weight: 0.12
    agents: [methodology_reviewer_zh]
    scored: true
    required: false
    applies_to: [empirical, registered-report, data-paper, software-tool, benchmark]
    fallback_weight_to: logic_consistency

  - id: data_analysis
    name: "数据分析、材料证据与稳健性"
    weight: 0.10
    agents: [data_analysis_reviewer_zh]
    scored: true
    required: false
    applies_to: [empirical, data-paper, software-tool, benchmark]
    fallback_weight_to: problem_contribution

  - id: logic_consistency
    name: "论证逻辑与内在一致性"
    weight: 0.12
    agents: [logic_consistency_zh]
    scored: true
    required: true

  - id: structure_organization
    name: "结构组织与篇章推进"
    weight: 0.08
    agents: [structure_reviewer_zh]
    scored: true
    required: true

  - id: innovation_fit
    name: "创新性、贡献表述与期刊匹配"
    weight: 0.10
    agents: [innovation_reviewer_zh]
    scored: true
    required: true

  - id: format_reference
    name: "格式规范、注释体例与 GB/T 7714 参考文献"
    weight: 0.06
    agents: [format_compliance_zh]
    scored: true
    required: true

  - id: academic_style
    name: "中文学术表达与可发表性语言"
    weight: 0.04
    agents: [academic_style_reviewer_zh]
    scored: true
    required: true

  - id: ai_tone_translation_trace
    name: "AI 痕迹、翻译腔与模板化表达风险"
    weight: 0.00
    agents: [ai_tone_detector_zh]
    scored: false
    runs: 3
    output: risk_report

  - id: factual_reference_risk
    name: "事实准确性与引用可核查风险"
    weight: 0.00
    agents: [factual_accuracy_zh]
    scored: false
    runs: 1
    output: risk_report

  - id: first_review_synthesis
    name: "中文期刊一审问题清单综合"
    weight: 0.00
    agents: [first_review_synthesizer_zh]
    scored: false
    runs: 1
    output: revision_plan

grade_thresholds:
  ready_for_submission:
    min_overall: 82
    label: "接近可投，但仍需按一审清单压缩风险"
  minor_revision:
    min_overall: 75
    label: "小修后可考虑投稿"
  major_revision:
    min_overall: 65
    label: "需要大修，不建议立即投稿"
  reject_and_rebuild:
    min_overall: 50
    label: "建议重构核心论证/方法/文献后再评审"
  not_publishable:
    max_overall: 49
    label: "当前版本不具备投稿基础"

gate_blockers:
  - id: suspected_fabrication
    name: "疑似数据/案例/引用造假"
    severity: Critical
    action: block_submission
    triggered_by: [factual_accuracy_zh, methodology_reviewer_zh, data_analysis_reviewer_zh]
  - id: missing_domestic_literature
    name: "中文核心投稿缺失关键国内研究脉络"
    severity: Critical
    action: cap_overall_at_68
    triggered_by: [literature_reviewer_zh]
    applies_to_tiers: [A, B1, B2, C1]
  - id: empirical_without_method
    name: "实证/数据论文缺少可审查的方法、样本或数据说明"
    severity: Critical
    action: cap_overall_at_60
    triggered_by: [methodology_reviewer_zh, data_analysis_reviewer_zh]
    applies_to_paper_types: [empirical, registered-report, data-paper, benchmark]
  - id: unsupported_contribution_claim
    name: "创新或贡献声明无法由正文证据支撑"
    severity: Major
    action: cap_overall_at_72
    triggered_by: [innovation_reviewer_zh, logic_consistency_zh]
  - id: reference_format_noncompliance
    name: "GB/T 7714 或目标期刊格式严重不合规"
    severity: Major
    action: cap_overall_at_76
    triggered_by: [format_compliance_zh]
  - id: ai_template_heavy
    name: "AI 模板化表达/翻译腔严重，影响学术可信度"
    severity: Major
    action: require_language_revision
    triggered_by: [ai_tone_detector_zh, academic_style_reviewer_zh]

coupling_rules:
  - id: low_literature_caps_innovation
    if: "literature_context < 65"
    then: "innovation_fit <= 70"
    rationale: "文献脉络不完整时，创新性声明不能被充分确认。"
  - id: low_method_caps_data_claims
    if: "methodology_design < 60"
    then: "data_analysis <= 65 and problem_contribution <= 72"
    applies_to_paper_types: [empirical, registered-report, data-paper, benchmark]
    rationale: "方法设计不足会削弱数据解释和结论贡献。"
  - id: high_ai_trace_requires_style_review
    if: "ai_tone_translation_trace.risk in [High, Severe]"
    then: "academic_style <= 72 and add_required_revision('去 AI 模板化与翻译腔')"
    rationale: "中文期刊对套话、翻译腔、机械并列句非常敏感。"
  - id: tier_a_no_weak_dimension
    if: "journalTier == A and any_scored_dimension < 72"
    then: "overall <= 78"
    rationale: "A 类顶刊不能有明显短板。"
  - id: b1_requires_domestic_context
    if: "journalTier in [A, B1, B2, C1] and literature_context < 70"
    then: "overall <= 72"
    rationale: "中文核心投稿必须交代国内学术谱系。"

convergence:
  max_rounds: 3
  converged_when:
    new_critical: 0
    new_major: "<= 2"
  degeneration_stop: true
  hard_limit_action: "报告剩余问题给作者，附带未解决问题的 caveat"

output_contract:
  scored_agent_must_include:
    - "Part 1: 问题清单，按 Critical/Major/Minor 分级"
    - "Part 2: 证据与原因，引用论文具体段落/句子/表格"
    - "Part 3: 修改方案，给出可执行改法"
    - "DIMENSION_SCORE: <0-100>"
  scoreless_agent_must_include:
    - "RISK_LEVEL: Low|Medium|High|Severe"
    - "EVIDENCE: 触发风险的原文片段或位置"
    - "FIX: 修改或核查建议"
