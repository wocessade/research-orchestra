# Academic Journal — declarative loading manifest (SELF-CONTAINED)
# Journal article writing module. Only S-series stages, no thesis/course stages.
# All external skill dependencies have been extracted and frozen under
# skills-embedded/. Stage files reference local files, NOT Skill tool calls.

name: academic-journal
version: "2.0"
description: Journal article writing module — idea/data/manuscript to submission

# ── Session Variables ──────────────────────────────
# Set once at session start and referenced in stage files.
session_variables:
  output_dir:
    description: "Directory path for writing intermediate and final output files. Set before any stage executes. Resolves to {output_dir_base}/{paper_slug}/ after directory resolution. Default base: ./paper_output_{entry_point}"
    default: "./paper_output_{entry_point}"
  paper_slug:
    description: "Per-paper unique identifier in format {YYYYMMDD_HHMMSS}_{english_slug}. Generated at pipeline start from current timestamp + paper topic. Each paper project gets its own complete directory. Example: '20260623_143000_chen-ran-body-narrative'"
    default: null
  paper_dir:
    description: "Full per-paper output path = {output_dir_base}/{paper_slug}/. This is what {output_dir} resolves to after directory resolution. e.g. ./paper_output_journal/20260623_143000_chen-ran-body-narrative/"
    default: null
  pipeline_root:
    description: "Root directory of the pipeline skill. Auto-detected at session start as the directory containing manifest.yaml. Used by CLI commands in stage files (e.g., literature/literature_search.py, evaluate/scripts/scoring.py)."
    default: "."

# ── Axes ───────────────────────────────────────────
# Values are detected at session start and updated dynamically
axes:
  entry_point:
    description: "How does the paper start?"
    values: [idea-first, data-first, existing-manuscript, partial-manuscript]
    detect:
      idea-first: "User describes a topic or idea without data files"
      data-first: "User provides data files (CSV, Excel, etc.) or says they have data"
      existing-manuscript: "User has a complete draft of the manuscript"
      partial-manuscript: "User provides a partially-completed manuscript — some sections are finished, others are incomplete/placeholder/missing"

  paperType:
    description: "Type of academic paper"
    values: [empirical, literature-review, theory, registered-report, data-paper, software-tool, benchmark]
    default: empirical
    detect:
      empirical: "User describes an empirical study with data collection/analysis"
      literature-review: "User describes a systematic review, meta-analysis, or literature survey"
      theory: "User describes a theoretical, conceptual, or framework paper"
      registered-report: "User mentions registered report, pre-registration, or two-stage review"
      data-paper: "User describes a data descriptor or data resource paper"
      software-tool: "User describes a software tool, package, or library paper"
      benchmark: "User describes a benchmark, competition, or comparative evaluation paper"

  hasData:
    description: "Whether the user has provided data files for data-first entry"
    values: [true, false]
    default: false
    detect:
      true: "User has attached or referenced data files (CSV, Excel, SPSS, questionnaire data, experimental results, etc.)"
      false: "User has not provided data files"

  mode:
    description: "Writing mode — stepping pauses after each section for author review; standard writes through then reviews"
    values: [stepping, standard, revision-only, submission-only]
    default: standard
    detect:
      stepping: "User requests stepping mode, 步进模式, section-by-section, or wants frequent check-in"
      standard: "Default — user didn't specify stepping or wants a continuous write-through"
      revision-only: "User only wants review and revision of an existing draft"
      submission-only: "User only needs submission preparation from an accepted manuscript"
    route:
      - condition: {axis: entry_point, value: partial-manuscript}
        default_mode: stepping
        note: "Partial manuscripts default to stepping mode for per-section consistency checks — can be overridden"

  stage:
    description: "Current active pipeline stage"
    values: [D0, D1, D2, SP, S0.5, S1, S1.5, S2, S2-LR, S2.5, S3, S4, S5, S6, S6.5, S7, S8.5, S8.6, S8, S8.25, S9, S9.5, S10, S11, S12]

  language:
    description: "User's working language"
    values: [en, zh]
    default: en

  venue:
    description: "Target publication venue type"
    values: [international, chinese-domestic, chinese-conference]
    default: international

  discipline:
    description: "Academic discipline for domain-specific conventions"
    values: [general, stem]
    default: general
    detect:
      stem: "User mentions CS, 计算机, CCF, CCF conference, ACM, IEEE, or the paper is a software/system/benchmark/algorithm paper"

  urgency:
    description: "Time pressure"
    values: [normal, emergency]
    default: normal

  preprint:
    description: "Whether the user wants to post a preprint before submission"
    values: [true, false]
    default: false
    detect:
      true: "User explicitly requests or mentions posting a preprint (arXiv, bioRxiv, SSRN, ChinaXiv, etc.)"
      false: "No preprint request — default"

  writingFormat:
    description: "Target output format for the manuscript"
    values: [latex, word, markdown, typst, auto-detect]
    default: auto-detect
    detect:
      latex: "User mentions LaTeX, Overleaf, .tex files, or CS/math/physics discipline"
      word: "User says Word, .docx, or is in humanities/social sciences"
      typst: "User mentions Typst, .typ files"
      markdown: "User mentions Markdown, .md, or R Markdown"

  status:
    description: "Post-submission manuscript status (set at Q11, not at session start)"
    values: [submitted, R&R, accepted, rejected]
    default: submitted

