# ── On Demand: Strategists ──────────────────────────
# Load ONE strategist file at a time. The current stage is determined
# by the `stage` axis — never pre-load future strategists.
strategists:
  D0:
    file: strategists/D0-strategist.md
    next: D1
    entry_point: data-first
    condition:
      axis: hasData
      value: true
  D1:
    file: strategists/D1-strategist.md
    next: D2
  D2:
    file: strategists/D2-strategist.md
    next: S0.5
  S1:
    file: strategists/S1-strategist.md
    next: S0.5
    entry_point: idea-first
  SP:
    file: strategists/SP-strategist.md
    next: S4
    entry_point: partial-manuscript
  S0.5:
    file: strategists/S0.5-strategist.md
    route:
      - condition: {axis: paperType, value: literature-review}
        next: S2-LR
      - condition: {axis: paperType, value: registered-report}
        next: S1.5
      - condition: {axis: paperType, value: theory}
        next: S2
      - condition: {axis: paperType, value: data-paper}
        next: S2
      - condition: {axis: paperType, value: software-tool}
        next: S2
      - condition: {axis: paperType, value: benchmark}
        next: S2
      - default: S1.5
  S1.5:
    file: strategists/S1.5-strategist.md
    next: S2
  S2:
    file: strategists/S2-strategist.md
    next: S2.5
  S2-LR:
    file: strategists/S2-LR-strategist.md
    next: S2.5
  S2.5:
    file: strategists/S2.5-strategist.md
    next: S3
  S3:
    file: strategists/S3-strategist.md
    next: S4
  S4:
    file: strategists/S4-strategist.md
    parallel_group: [S5, S6, S6.5]
    parallel_group_next: S7
  S5:
    file: strategists/S5-strategist.md
    next: S7
  S6:
    file: strategists/S6-strategist.md
    next: S7
  S6.5:
    file: strategists/S6.5-strategist.md
    next: S7
  S7:
    file: strategists/S7-strategist.md
    next: S8.5
    entry_point: existing-manuscript
  S8.5:
    file: strategists/S8.5-strategist.md
    route:
      - condition: {axis: venue, value: chinese-domestic}
        next: S8.6
      - condition: {axis: venue, value: chinese-conference}
        next: S8
      - default: S8
  S8.6:
    file: strategists/S8.6-strategist.md
    next: S8
    condition:
      axis: venue
      value: chinese-domestic
  S8:
    file: strategists/S8-strategist.md
    clean_context: true
    context_note: "S9 review stage can only read the final manuscript and Passport, and must not access writing-stage context"
    route:
      - condition: {axis: preprint, value: true}
        next: S8.25
      - default: S9
    note: "S8.25 (preprint) is ADVISORY — route triggers when 'preprint' axis is set to true."
  S8.25:
    file: strategists/S8.25-strategist.md
    next: S9
  S9:
    file: strategists/S9-strategist.md
    next: S9.5
  S9.5:
    file: strategists/S9.5-strategist.md
    next: S10
  S10:
    file: strategists/S10-strategist.md
    next: S11
  S11:
    file: strategists/S11-strategist.md
    route:
      - condition: {axis: status, value: R&R}
        next: S12
      - default: null  # terminal — acceptance or rejection
  S12:
    file: strategists/S12-strategist.md
    next: null  # terminal — resubmission complete

