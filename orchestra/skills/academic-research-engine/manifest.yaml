# Academic Research Engine — declarative loading manifest
name: academic-research-engine
version: "1.0"
description: Research state machine + orchestrator (RQ/EXP/NEG/radar/handoff)

session_variables:
  research_root:
    description: "Root of .research/ tree (often repo root or parent of paper_dir)"
    default: ".research"
  paper_dir:
    description: "Target manuscript directory for handoff (.paper lives here)"
    default: null

axes:
  persona:
    description: "Program depth axis (single skill, not multiple engines)"
    values: [explorer, focused_paper, multi_project, lab_lead]
    default: explorer
    detect:
      explorer: "User is early-stage / clarifying RQ / first paper"
      focused_paper: "Single manuscript track with clear venue"
      multi_project: "Multiple papers sharing one research root"
      lab_lead: "Advisor/lab lead / student task cards / portfolio"

  intent:
    description: "Primary user intent this turn"
    values: [radar, rq, exp, ingest, neg, handoff, weekly, deep_synthesize, adversarial, bootstrap]
    detect:
      radar: "雷达, watchlist, 日推, inbox, literature radar"
      rq: "开 RQ, 研究问题, 假设, hypothesis"
      exp: "实验卡, EXP, 设计实验, ablation"
      ingest: "摄入, ingest, metrics.json, 回填 run"
      neg: "负结果, NEG, null result, 失败"
      handoff: "handoff, 准备写稿, ready_for_writing"
      weekly: "组会, weekly-review, 周报讨论"
      deep_synthesize: "deep synthesize, 深度综述, DR 报告"
      adversarial: "对抗核验, adversarial claim"
      bootstrap: "初始化 .research, scaffold"

  compute_mode:
    description: "How experiments are executed"
    values: [human_in_loop, ci_cpu, optional_gpu]
    default: human_in_loop
    detect:
      human_in_loop: "Default — user/CI runs jobs; engine registers"
      ci_cpu: "User asks for CPU CI job scaffolding"
      optional_gpu: "User explicitly owns GPU runs (engine still does not auto-launch)"

always_load:
  - references/workflow.md

references:
  radar-routing:
    file: references/radar-routing.md
    condition: {axis: intent, value: [radar, weekly, deep_synthesize]}
  rq-hypothesis:
    file: references/rq-hypothesis.md
    condition: {axis: intent, value: [rq, bootstrap]}
  experiment-card:
    file: references/experiment-card.md
    condition: {axis: intent, value: [exp, ingest]}
  negative-results:
    file: references/negative-results.md
    condition: {axis: intent, value: [neg, ingest]}
  handoff-to-writing:
    file: references/handoff-to-writing.md
    condition: {axis: intent, value: handoff}
  personas:
    file: references/personas.md
    condition: {axis: persona, value: [multi_project, lab_lead]}
    on_demand: true
  adversarial-claim-check:
    file: references/adversarial-claim-check.md
    condition: {axis: intent, value: adversarial}
    on_demand: true
  deep-synthesize:
    file: references/deep-synthesize.md
    condition: {axis: intent, value: deep_synthesize}
    on_demand: true
  shared-schemas:
    file: ../academic-shared/research/schemas.md
    on_demand: true
  metrics-schema:
    file: ../academic-shared/research/metrics.schema.json
    condition: {axis: intent, value: ingest}
    on_demand: true

scripts:
  validate_experiment_card:
    file: scripts/validate_experiment_card.py
  ingest_run:
    file: scripts/ingest_run.py
  handoff_sync:
    file: scripts/handoff_sync.py

templates:
  - templates/program.yaml
  - templates/rq.md
  - templates/hypothesis.md
  - templates/experiment-card.md
  - templates/negative.md
  - templates/watchlist.yaml
  - templates/inbox-entry.md
  - templates/ready_for_writing.md
  - templates/read-bridge.md

# Sibling call-outs (never vendor)
nature_callouts:
  - ../nature-literature-pipeline/SKILL.md
  - ../nature-reader/SKILL.md
  - ../nature-weekly-review/SKILL.md
  - ../academic-shared/literature/literature_search.py
