tier: course
label: "课程大作业"
# @agent-count: 6 (4 scored + 2 scoreless: ai_tone, factual_accuracy)
dimensions:
  - id: content
    name: "内容质量"
    weight: 0.25
    agents: [content_reviewer]
  - id: structure
    name: "结构逻辑"
    weight: 0.15
    agents: [structure_reviewer]
  - id: ai_tone
    name: "AI痕迹"
    weight: 0.15
    scoreless: true
    agents: [ai_tone_detector]
  - id: format
    name: "格式规范"
    weight: 0.30
    agents: [format_compliance]
  - id: logic
    name: "逻辑一致性"
    weight: 0.15
    agents: [logic_consistency]
  - id: factual_accuracy
    name: "事实准确性"
    weight: 0
    scoreless: true
    agents: [factual_accuracy]
grade_thresholds:
  优: 90
  良: 75
  中: 60
  差: 0
gate_blockers:
  - missing_required_section
  - pervasive_ai_tone
  - insufficient_page_count
  - logic_contradiction
  - factual_error

coupling_rules:
  - source: ai_tone
    targets: [content, logic]
    type: clamp_max
    base_cap: 35
    release_rate: 0.016

  - sources: [format, content]
    type: divergence_penalty
    condition:
      min_divergence: 20
      target_max_for_penalty: 60
    penalty_factor: 0.3
    max_penalty: 8
    target: content

ai_tone_curves:
  # Positive signals: HIGH density → AI (sigmoid)
  benwen:       {weight: 25, curve: sigmoid, inflection: 13, steepness: 0.3}
  gaix:         {weight: 10, curve: sigmoid, inflection: 12, steepness: 0.25}
  danshi:       {weight: 8,  curve: sigmoid, inflection: 10, steepness: 0.3}
  suizhe:       {weight: 8,  curve: sigmoid, inflection: 4,  steepness: 0.5}
  ba:           {weight: 10, curve: sigmoid, inflection: 6,  steepness: 0.3}
  jinxing:      {weight: 15, curve: sigmoid, inflection: 15, steepness: 0.25, stem: {inflection: 25}}
  # Negative signals: ZERO/LOW density → AI (inverted sigmoid)
  yinci:        {weight: 8,  curve: inverted_sigmoid, inflection: 3,  steepness: 0.5}
  tongguo:      {weight: 8,  curve: inverted_sigmoid, inflection: 5,  steepness: 0.3}

ai_fusion:
  agreement_threshold: 0.5
  disagree_shrink: 0.3
  low_signal_shrink: 0.4
  script_keys:
    - bei_density
    - zai_construction_density
    - tongguo_density
    - bujin_density
    - cong_perspective_density
    - juyou_density
    - conger_density
    - chengwei_density
  thresholds:
    bei_density: 7.3
    zai_construction_density: 49.9
    tongguo_density: 27.7
    bujin_density: 14.1
    cong_perspective_density: 4.3
    juyou_density: 7.2
    conger_density: 2.6
    chengwei_density: 3.6

length_limits:
  min: 5000
  max: 30000
  too_short_penalty: 0.008
  too_long_penalty: 0.001
