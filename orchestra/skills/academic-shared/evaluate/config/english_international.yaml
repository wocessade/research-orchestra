# academic-shared/evaluate/config/english_international.yaml
# English international journal paper evaluation with tier-aware review profiles.

id: english_international
name: "English International Journal Evaluation"
version: "2.0.0"
language: en
venue: international
description: "English international journal paper evaluation — tier-calibrated review for T1 (top-tier) through T5 (conference)."

engine:
  scoring_script: "academic-shared/evaluate/scripts/scoring.py"
  aggregation: weighted_median
  scored_agent_runs: 3
  scoreless_agent_runs: 1
  high_variance_threshold: 15
  require_issue_severity_labels: true
  issue_severity_labels: [Critical, Major, Minor]
  median_score_policy: "use median of three scored runs; if max-min > high_variance_threshold, add HIGH_VARIANCE flag"

review_principles:
  default_stance: "Tier-calibrated reviewer — assess whether the paper meets the publication standard of the target journal tier, not nitpick indiscriminately"
  anti_flattery: false
  calibration: "Score against the target journal tier's quality bar. If the paper genuinely meets the standard, report that honestly. If it falls short, identify the specific gaps."
  first_review_expectation: "Each scored agent identifies issues based on actual paper quality. No minimum issue quota. Critical/Major issues must be accompanied by text evidence and actionable revision suggestions."
  evidence_standard: "All judgments must be grounded in the paper text, research design, evidence chain, literature context, and target journal tier."

default_tier: T3

tier_profiles:
  T1:
    label: "T1: Top-tier (Nature / Science / Cell / NEJM / field-top)"
    target: "Groundbreaking novelty or major advance. Methods must be sound but are not nitpicked — the bar is on significance and conceptual advance."
    min_overall_submit: 85
    no_dimension_below: 70
    emphasis:
      innovation_fit: very_high
      theory_depth: very_high
      content: very_high
      methodology_design: high
    review_density: "Focused — few but deep comments. Minor formatting/language issues are irrelevant at this tier."
    novelty_first: true
  T2:
    label: "T2: Strong field journals (society journals, top subfield)"
    target: "Solid methodology, clear contribution to the field, thorough literature engagement."
    min_overall_submit: 78
    no_dimension_below: 65
    emphasis:
      methodology_design: high
      content: high
      logic: high
      innovation_fit: high
  T3:
    label: "T3: Standard international journals"
    target: "Sound work with a clear, modest contribution. Methodology must be correct; novelty can be incremental."
    min_overall_submit: 72
    no_dimension_below: 60
    emphasis:
      methodology_design: high
      logic: high
      format: high
  T4:
    label: "T4: OA mega-journals (PLOS ONE, Scientific Reports, etc.)"
    target: "Methodological soundness ONLY — no novelty or significance requirement. Technically correct work passes regardless of perceived importance."
    min_overall_submit: 68
    no_dimension_below: 55
    emphasis:
      methodology_design: very_high
      data_analysis: very_high
    deemphasize: [innovation_fit, theory_depth]
    review_density: "Soundness check — focus exclusively on whether the science is correct."
  T5:
    label: "T5: International conferences"
    target: "Interesting direction, matching conference theme. Short format acceptable; contribution can be in-progress."
    min_overall_submit: 65
    no_dimension_below: 50
    emphasis:
      content: high
      innovation_fit: high
    deemphasize: [format, reference_quality]

paper_type_profiles:
  empirical:
    must_run: [methodology_reviewer_en, data_analysis_reviewer_en]
    emphasis: [methodology_design, data_analysis, content]
  literature-review:
    emphasis: [content, logic, innovation_fit]
  theory:
    emphasis: [theory_depth, logic, innovation_fit]
  registered-report:
    emphasis: [methodology_design, logic, format]
  data-paper:
    emphasis: [data_analysis, methodology_design, format]
  software-tool:
    emphasis: [methodology_design, data_analysis, innovation_fit]
  benchmark:
    emphasis: [methodology_design, data_analysis, content]

# @agent-count: 10 (6 core scored + 1 scoreless ai_tone + 3 optional scored)
dimensions:
  - id: content
    name: "Content Quality & Argumentation"
    weight: 0.25
    agents: [content_reviewer_en]
    scored: true
    required: true

  - id: structure
    name: "Structure & Organization"
    weight: 0.15
    agents: [structure_reviewer_en]
    scored: true
    required: true

  - id: ai_tone
    name: "AI-Tone Detection"
    weight: 0.00
    scoreless: true
    agents: [ai_tone_detector_en]

  - id: logic
    name: "Logic & Consistency"
    weight: 0.15
    agents: [logic_consistency_en]
    scored: true
    required: true

  - id: format
    name: "Format Compliance"
    weight: 0.10
    agents: [format_compliance_en]
    scored: true
    required: true

  - id: reference_quality
    name: "Reference Quality"
    weight: 0.15
    agents: [reference_quality_en]
    scored: true
    required: true

  # Optional scored agents — activated by paper_type_profiles
  - id: methodology_design
    name: "Methodology & Research Design"
    weight: 0.10
    agents: [methodology_reviewer_en]
    scored: true
    required: false
    applies_to: [empirical, registered-report, data-paper, software-tool, benchmark]
    fallback_weight_to: content

  - id: data_analysis
    name: "Data Analysis & Reporting"
    weight: 0.10
    agents: [data_analysis_reviewer_en]
    scored: true
    required: false
    applies_to: [empirical, data-paper, software-tool, benchmark]
    fallback_weight_to: content

  - id: innovation_fit
    name: "Innovation & Contribution"
    weight: 0.10
    agents: [innovation_reviewer_en]
    scored: true
    required: false
    fallback_weight_to: content

  - id: theory_depth
    name: "Theory Depth & Framework"
    weight: 0.10
    agents: [theory_depth_reviewer_en]
    scored: true
    required: false
    fallback_weight_to: logic

optional_agents:
  - methodology_reviewer_en
  - innovation_reviewer_en
  - data_analysis_reviewer_en
  - theory_depth_reviewer_en

grade_thresholds:
  ready_for_submission:
    min_overall: 82
    label: "Close to submission-ready; address remaining issues before submitting"
  minor_revision:
    min_overall: 75
    label: "Minor revision suggested before submission"
  major_revision:
    min_overall: 65
    label: "Major revision needed; not ready for submission"
  reject_and_rebuild:
    min_overall: 50
    label: "Core argument/method/literature needs rebuilding before re-evaluation"
  not_publishable:
    max_overall: 49
    label: "Current version lacks submission foundations"

gate_blockers:
  - id: no_clear_contribution
    name: "No clear research contribution"
    severity: Critical
    action: block_submission
    triggered_by: [content_reviewer_en, innovation_reviewer_en]
  - id: missing_core_section
    name: "Missing required IMRAD section"
    severity: Critical
    action: block_submission
    triggered_by: [structure_reviewer_en]
  - id: extensive_ai_generated_text
    name: "Extensive AI-generated text compromising academic integrity"
    severity: Critical
    action: require_language_revision
    triggered_by: [ai_tone_detector_en]
  - id: fabricated_citations
    name: "Suspected fabricated or untraceable citations"
    severity: Critical
    action: block_submission
    triggered_by: [reference_quality_en]
  - id: no_evidence_for_claims
    name: "Core claims lack supporting evidence"
    severity: Critical
    action: block_submission
    triggered_by: [content_reviewer_en, logic_consistency_en]
  - id: methods_not_described
    name: "Methods insufficiently described for reproducibility"
    severity: Critical
    action: block_submission
    triggered_by: [methodology_reviewer_en]
  - id: logic_contradiction
    name: "Fundamental internal logical contradiction"
    severity: Critical
    action: block_submission
    triggered_by: [logic_consistency_en]
  - id: insufficient_references
    name: "Reference list severely inadequate"
    severity: Major
    action: cap_overall_at_65
    triggered_by: [reference_quality_en]
  - id: t1_novelty_gap
    name: "T1 submission lacks required novelty/significance for top-tier venue"
    severity: Critical
    action: cap_overall_at_78
    triggered_by: [innovation_reviewer_en]
    applies_to_tiers: [T1]

coupling_rules:
  # Rule 1: AI tone clamps content, logic, and optional methodology
  - source: ai_tone
    targets: [content, logic]
    type: clamp_max
    base_cap: 30
    release_rate: 0.020

  # Rule 2: AI tone + innovation dynamic weight (when optional agents used)
  - sources: [ai_tone, innovation]
    target: innovation
    type: dynamic_weight
    default_weight: 0.10
    mapping:
      - condition: "ai_tone >= 70 && innovation >= 70"
        weight: 0.20
        borrow_from:
          format: -0.05
          reference_quality: -0.05
      - condition: "ai_tone >= 50 && innovation >= 70"
        weight: 0.15
        borrow_from:
          format: -0.03
          reference_quality: -0.02
      - condition: "ai_tone <= 50"
        weight: 0.05
        give_to:
          content: 0.03
          structure: 0.02

  # Rule 3: Method rigor caps data analysis (if optional agents used)
  - source: methodology
    targets: [data_analysis]
    type: clamp_max
    base_cap: 30
    release_rate: 0.025

  # Rule 4: T1 tier — weak innovation caps overall
  - if: "journalTier == T1 and innovation_fit < 70"
    then: "overall <= 78"
    rationale: "T1 journals require substantive novelty."

convergence:
  max_rounds: 3
  converged_when:
    new_critical: 0
    new_major: "<= 2"
  degeneration_stop: true
  hard_limit_action: "Report remaining issues to user with caveat about unresolved items."

# ── AI Tone Detection Curves (preserved from v1) ──
ai_tone_curves:
  # ── D1: English Tier 1 word penalty (from english-de-ai-guide.md) ──
  # Positive signals: HIGH density → AI (sigmoid)
  delve:        {weight: 25, curve: sigmoid, inflection: 1, steepness: 0.5}
  pivotal:      {weight: 15, curve: sigmoid, inflection: 1, steepness: 0.5}
  realm:        {weight: 15, curve: sigmoid, inflection: 1, steepness: 0.5}
  foster:       {weight: 12, curve: sigmoid, inflection: 2, steepness: 0.4}
  intricate:    {weight: 12, curve: sigmoid, inflection: 1, steepness: 0.5}
  tapestry:     {weight: 20, curve: sigmoid, inflection: 1, steepness: 0.6}
  multifaceted: {weight: 10, curve: sigmoid, inflection: 2, steepness: 0.4}
  underscoring: {weight: 15, curve: sigmoid, inflection: 2, steepness: 0.4}
  testament:    {weight: 10, curve: sigmoid, inflection: 1, steepness: 0.5}
  landscape:    {weight: 8,  curve: sigmoid, inflection: 3, steepness: 0.3}
  crucial:      {weight: 8,  curve: sigmoid, inflection: 5, steepness: 0.3}

  # ── D2: Discourse marker over-density ──
  moreover:     {weight: 15, curve: sigmoid, inflection: 1, steepness: 0.6}
  furthermore:  {weight: 10, curve: sigmoid, inflection: 3, steepness: 0.3}
  additionally: {weight: 8,  curve: sigmoid, inflection: 3, steepness: 0.3}
  notably:      {weight: 12, curve: sigmoid, inflection: 2, steepness: 0.4}
  importantly:  {weight: 10, curve: sigmoid, inflection: 2, steepness: 0.4}
  interestingly: {weight: 8, curve: sigmoid, inflection: 2, steepness: 0.4}

  # ── D4: "Not only...but also" binary signal ──
  not_only_but_also: {weight: 15, curve: sigmoid, inflection: 1, steepness: 0.6}

  # ── D5: Signposting over-density ──
  signposting:  {weight: 10, curve: sigmoid, inflection: 4, steepness: 0.25}

  # ── D10: Preposition padding ──
  padding_phrases: {weight: 8, curve: sigmoid, inflection: 5, steepness: 0.25}

  # ── D2: Negative signals (LOW density → AI) ──
  however_variety:
    weight: 8
    curve: inverted_sigmoid
    inflection: 3
    steepness: 0.4
    note: "Low variety in contrastive discourse markers is suspicious. LLMs repeat 'However'."

  # ── D3: Sentence-length uniformity ──
  sentence_sd:
    weight: 12
    curve: inverted_sigmoid
    inflection: 10
    steepness: 0.5
    note: "Sentence-length SD below 10 words → likely AI (low burstiness)."

  # ── D15: Number/specificity density (LOW density → AI) ──
  number_density:
    weight: 10
    curve: inverted_sigmoid
    inflection: 5
    steepness: 0.3
    note: "Low density of numbers/effect sizes/CIs → lack of specificity (AI hallmark)."

  # ── D17: Light-verb / collocation literalness (NNES-specific) ──
  light_verb_density:
    weight: 12
    curve: sigmoid
    inflection: 2
    steepness: 0.5
    note: "High density of conduct/perform/carry out + nominalization → Chinese NNES calque. Exempt for native English speakers."
  conduct_analysis:   {weight: 10, curve: sigmoid, inflection: 1, steepness: 0.6}
  perform_investigation: {weight: 10, curve: sigmoid, inflection: 1, steepness: 0.6}
  carry_out_research: {weight: 10, curve: sigmoid, inflection: 1, steepness: 0.6}
  make_conclusion:    {weight: 10, curve: sigmoid, inflection: 1, steepness: 0.6}
  give_explanation:   {weight: 8,  curve: sigmoid, inflection: 2, steepness: 0.4}
  conduct_evaluation: {weight: 8,  curve: sigmoid, inflection: 2, steepness: 0.4}

  # ── D18: Clause-opening monotony ──
  opener_entropy:
    weight: 10
    curve: inverted_sigmoid
    inflection: 1.5
    steepness: 2.0
    note: "Low sentence-opening entropy → restricted opener variety. Compute H over 5 opener families."

  # Opener family frequencies (penalize overuse)
  this_paper_study:   {weight: 6,  curve: sigmoid, inflection: 5, steepness: 0.3}
  expletive_it:       {weight: 8,  curve: sigmoid, inflection: 3, steepness: 0.4}
  expletive_there:    {weight: 6,  curve: sigmoid, inflection: 4, steepness: 0.35}
  discourse_opener:   {weight: 6,  curve: sigmoid, inflection: 6, steepness: 0.25}

ai_fusion:
  agreement_threshold: 0.5
  disagree_shrink: 0.3
  low_signal_shrink: 0.4
  script_keys:
    - delve_density
    - pivotal_density
    - realm_density
    - foster_density
    - intricate_density
    - tapestry_density
    - moreover_density
    - furthermore_density
    - notably_density
    - not_only_but_also_density
    - signposting_density
    - padding_density
    - sentence_sd_value
    - number_density_value
    - light_verb_density_value
    - opener_entropy_value
  thresholds:
    delve_density: 1.0
    pivotal_density: 1.0
    realm_density: 1.0
    foster_density: 2.0
    intricate_density: 1.0
    tapestry_density: 0.5
    moreover_density: 0.5
    furthermore_density: 3.0
    notably_density: 2.0
    not_only_but_also_density: 0.5
    signposting_density: 5.0
    padding_density: 6.0
    sentence_sd_value: 10.0
    number_density_value: 5.0
    light_verb_density_value: 2.0
    opener_entropy_value: 1.5

length_limits:
  min: 3000
  max: 12000
  too_short_penalty: 0.005
  too_long_penalty: 0.001

output_contract:
  scored_agent_must_include:
    - "Part 1 [Issues]: Tagged with [Critical/Major/Minor], with text evidence"
    - "Part 2 [Scoring]: Per-rubric-item deductions with rationale"
    - "Part 3 [Fixes]: Actionable revision suggestions"
    - "DIMENSION_SCORE: <0-100>"
  scoreless_agent_must_include:
    - "RISK_LEVEL: Low|Medium|High|Severe"
    - "EVIDENCE: Triggering text passages"
    - "FIX: Remediation suggestions"
