tier: humanities_bachelor
label: "文科本科毕业论文"
discipline: humanities

# @agent-count: 9 (7 scored + 2 scoreless: ai_tone, factual_accuracy)
# ═══════════════════════════════════════════════════════════
# 7 Scored Dimensions — Humanities-Specific
# ═══════════════════════════════════════════════════════════
# Key differences from STEM bachelor.yaml:
#   - 论证质量 (0.25): replaces STEM's content (0.22) as heaviest dimension
#   - 理论框架 (0.15): NEW dimension — theory deployment is critical in humanities
#   - 文本分析深度 (0.15): NEW — close reading skill is the core humanities method
#   - AI痕迹 (0.10): reduced from STEM's 0.15 — harder to judge in humanities
#   - 结构逻辑 (0.08): reduced — structure matters less than argument quality
#   - 学术规范 (0.05): reduced from STEM's 0.15 — format shouldn't dominate
dimensions:
  - id: argument_quality
    name: "论证质量"
    weight: 0.25
    agents: [content_reviewer_humanities]
    description: >
      核心论证的说服力：论点是否明确、可辩驳？论证链条是否完整？
      对原文的解读是否经得起推敲？结论是否有文本依据支撑？

  - id: theoretical_framework
    name: "理论框架"
    weight: 0.15
    agents: [theory_framework_humanities]
    description: >
      理论框架是否清晰且被有效运用？理论是否真正指导分析，
      还是仅仅"贴标签"？是否理解了理论的核心概念而不仅仅是引用其名字？

  - id: textual_analysis
    name: "文本分析深度"
    weight: 0.15
    agents: [content_reviewer_humanities]
    description: >
      对原文（一手文献/经典文本）的分析是否深入？是否展示了细读能力？
      分析是否超越了表面描述，揭示了文本的内在结构、矛盾或深层含义？

  - id: literature_review
    name: "文献综述"
    weight: 0.12
    agents: [reference_quality_humanities]
    description: >
      是否系统梳理了研究领域的核心文献？能否准确定位自己的研究在学术
      对话中的位置？是否展示了批判性综述能力（而非简单罗列）？

  - id: originality
    name: "创新性"
    weight: 0.10
    agents: [innovation_reviewer_humanities]
    score_mapping:
      type: power_scale
      min_ai_tone: 45
      floor: 35
      threshold: 15
      exponent: 0.45
    description: >
      是否对文本提出了非显而易见的解读？理论运用是否产生了洞察力
      而非仅仅描述现象？是否提出了可辩论的论点并有效辩护？

  - id: ai_tone
    name: "AI痕迹/语言表达"
    weight: 0.10
    scoreless: true
    agents: [ai_tone_detector_humanities]
    description: >
      语言文字是否自然、符合人文学科表达习惯？是否存在AI生成模式
      （叙事性AI/分析性AI/哲学性AI）？是否有独特的个人学术声音？

  - id: structure_logic
    name: "结构逻辑"
    weight: 0.08
    agents: [structure_reviewer_humanities]
    description: >
      论文结构是否为论证服务（而非仅仅是格式完整）？章节之间是否形成
      递进关系？论文章标题是否准确表达了核心论点？

  - id: academic_format
    name: "学术规范"
    weight: 0.05
    agents: [format_compliance_humanities]
    description: >
      是否符合GB/T 7714引用格式？章节编号、注释体例是否正确？
      必需的组成部分是否齐全？
  - id: factual_accuracy
    name: "事实准确性"
    weight: 0
    scoreless: true
    agents: [factual_accuracy]

# ── Grade thresholds ──
grade_thresholds:
  优: 85
  良: 70
  中: 60
  及格: 55
  不及格: 0

# ── Gate blockers (humanities-specific) ──
gate_blockers:
  - no_literature_review_chapter    # 缺少文献综述章节
  - no_theory_framework              # 无理论框架或理论仅被提及未使用
  - pervasive_ai_tone                # 大面积AI痕迹
  - missing_core_section             # 缺少核心组成部分
  - critical_argument_gap            # 论证关键缺失：无核心论点或论点不可辩护
  - plagiarism_risk_high             # 高度抄袭风险
  - insufficient_primary_sources     # 一手文献/原著引用不足
  - logic_contradiction              # 前后矛盾，解读自相矛盾
  - factual_error                    # 事实错误：章节数/数值/术语/交叉引用与实际不符

# ── Coupling rules (simplified for humanities) ──
coupling_rules:
  # Rule 1: AI tone clamps argument quality and structure logic, wider release
  - source: ai_tone
    targets: [argument_quality, structure_logic]
    type: clamp_max
    base_cap: 40
    release_rate: 0.022

  # Rule 2: AI tone + originality dynamic weight
  - sources: [ai_tone, originality]
    target: originality
    type: dynamic_weight
    default_weight: 0.10
    mapping:
      - condition: "ai_tone >= 70 && originality >= 70"
        weight: 0.18
        borrow_from:
          academic_format: -0.03
          structure_logic: -0.05
      - condition: "ai_tone >= 50 && originality >= 70"
        weight: 0.14
        borrow_from:
          academic_format: -0.02
          structure_logic: -0.02
      - condition: "ai_tone <= 45"
        weight: 0.05
        give_to:
          argument_quality: 0.03
          theoretical_framework: 0.02

  # NO divergence_penalty for humanities.
  # Format variance between high-content and low-content papers
  # is a natural consequence of style, not a quality signal.

# ═══════════════════════════════════════════════════════════
# AI TONE CURVES — Calibrated for humanities text patterns
# ═══════════════════════════════════════════════════════════
#
# KEY INSIGHT: Humanities papers have fundamentally different keyword
# distributions from STEM. "本文" is used less (humanities writers prefer
# passive or implicit self-reference). "该X" (该方案/该方法) is a STEM
# artifact for referring to methods/models — nearly absent in humanities.
# "进行" is also lower in humanities where description, not procedure,
# dominates. But humanities has its OWN AI patterns: grand historical
# narrative, plot-summary-as-analysis, false dialectics, etc.
#
ai_tone_curves:
  # ─── POSITIVE SIGNALS: HIGH density → AI (sigmoid) ───
  # Each: {weight, curve, inflection, steepness}
  # inflection = density (per 万 words) where penalty reaches 50% of weight

  benwen:
    weight: 20
    curve: sigmoid
    inflection: 8
    steepness: 0.35
    note: >
      人文学科论文中"本文"使用频率天然低于理工科。8次/万字即应扣分。

  gaix:
    weight: 6
    curve: sigmoid
    inflection: 5
    steepness: 0.25
    note: >
      "该X"是人文学科极罕见的用法（非指代词）。出现即高度可疑。

  danshi:
    weight: 8
    curve: sigmoid
    inflection: 12
    steepness: 0.25
    note: >
      人文学科论文中转折连词使用频率天然高于理工科（论证需要），
      因此阈值上浮至12/万字。

  suizhe:
    weight: 6
    curve: sigmoid
    inflection: 3
    steepness: 0.5
    note: >
      "随着……的发展"在文史哲论文中相对少见。

  ba:
    weight: 8
    curve: sigmoid
    inflection: 5
    steepness: 0.3
    note: >
      把字句在人文论文中频率低于理工科实验描述。

  jinxing:
    weight: 10
    curve: sigmoid
    inflection: 10
    steepness: 0.25
    note: >
      人文学科中"进行"的使用频率显著低于理工科。10次/万字即为可疑。

  # ── NEW: Humanities-specific positive AI signals ──

  gudian_narrative:
    weight: 12
    curve: sigmoid
    inflection: 1.5
    steepness: 0.6
    note: >
      宏大叙事模式："从古至今""纵观历史""千百年来"等。
      AI的"grand sweep"习惯。极低inflection — 出现1-2次即触发显著惩罚。

  shenghua:
    weight: 10
    curve: sigmoid
    inflection: 3
    steepness: 0.4
    note: >
      升华句式密度："不仅是……更是……""这深刻揭示了""从本质上说……
      AI论文倾向于在每段结尾升华，而人类只在结论部分适度提炼。

  duizhang_title:
    weight: 5
    curve: sigmoid
    inflection: 2
    steepness: 0.5
    note: >
      对仗式标题："X与Y：Z的W"格式。AI生成章节标题的偏好模式。

  paren_density:
    weight: 8
    curve: sigmoid
    inflection: 60
    steepness: 0.25
    note: >
      中文括号（——）密度。学术中文的正常密度为30-50次/万字
      （年标注、英文译名、术语解释等为常见原因）。
      超过60次/万字说明插入语过密，可能影响阅读流畅性。

  em_dash:
    weight: 12
    curve: sigmoid
    inflection: 10
    steepness: 0.3
    note: >
      破折号（——）密度。学术中文正常密度为5-10次/万字，
      超过10次/万字即触发扣分。破折号密集使用是AI生成文本
      的典型特征——AI倾向于用破折号插入解释性从句。

  kongdong:
    weight: 8
    curve: sigmoid
    inflection: 8
    steepness: 0.25
    note: >
      空洞学术词密度："深刻""深层""本质""内在逻辑"等。
      AI在缺乏实质论证时堆砌空洞学术词汇。

  meirong:
    weight: 6
    curve: sigmoid
    inflection: 4
    steepness: 0.3
    note: >
      美式学术模板："从X的视角来看""在Y的框架下""以Z为切入点"等。
      AI万能转场句式。

  # ─── NEGATIVE SIGNALS: ZERO/LOW density → AI (inverted_sigmoid) ───
  # Penalty near weight when count=0, near 0 when count >> inflection

  yinci:
    weight: 8
    curve: inverted_sigmoid
    inflection: 2
    steepness: 0.5
    note: >
      零或极低"因此/故此"密度在文史哲中可能是正常的，
      但也可能是AI论文缺乏因果连接。

  tongguo:
    weight: 6
    curve: inverted_sigmoid
    inflection: 3
    steepness: 0.3

  # ── NEW: Humanities-specific negative signals ──

  first_person:
    weight: 8
    curve: inverted_sigmoid
    inflection: 3
    steepness: 0.4
    note: >
      第一人称体验密度："我认为""初读时""我注意到"等。
      真实人类在文科论文中有个人阅读体验表述。
      零密度可能是AI生成（AI倾向于完全客观化叙述）。
      BUT: 有些导师明确要求不用"我"，所以权重控制在8。

  uncertainty:
    weight: 6
    curve: inverted_sigmoid
    inflection: 4
    steepness: 0.3
    note: >
      不确定性表达："或许""可能""似乎""某种程度上"等。
      人文学科真实学术写作有适度hedging。零hedging = AI过度自信。

  counter_intuitive:
    weight: 7
    curve: inverted_sigmoid
    inflection: 1.5
    steepness: 0.5
    note: >
      反直觉判断密度："表面上看……实际上……""不同于通常认为的……"
      这是人文学术写作的精髓——对文本的反直觉解读。
      零密度可能论文仅做描述性分析。

# ── AI Fusion (confidence-weighted fusion) ──
ai_fusion:
  agreement_threshold: 0.45
  disagree_shrink: 0.35
  low_signal_shrink: 0.45
  script_keys:
    - bei_density
    - zai_construction_density
    - tongguo_density
    - bujin_density
    - juyou_density
    - conger_density
    - chengwei_density
    - shenghua_density
    - kongdong_density
    - gudian_narrative_density
    - duizhang_title_raw
  thresholds:
    bei_density: 5.0
    zai_construction_density: 35.0
    tongguo_density: 18.0
    bujin_density: 12.0
    juyou_density: 5.0
    conger_density: 2.0
    chengwei_density: 2.5
    shenghua_density: 4.0
    kongdong_density: 10.0
    gudian_narrative_density: 1.5
    duizhang_title_raw: 2

# ── Length limits (humanities papers tend shorter) ──
length_limits:
  min: 8000
  max: 30000
  too_short_penalty: 0.008
  too_long_penalty: 0.001
