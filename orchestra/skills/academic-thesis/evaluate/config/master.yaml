tier: master
label: "硕士毕业论文"
# @agent-count: 11 (8 scored + 3 scoreless: ai_tone, factual_accuracy, ethics_reviewer)
dimensions:
  - id: content
    name: "内容质量"
    weight: 0.13
    agents: [content_reviewer]
  - id: structure
    name: "结构逻辑"
    weight: 0.10
    agents: [structure_reviewer]
  - id: ai_tone
    name: "AI痕迹"
    weight: 0.10
    scoreless: true
    agents: [ai_tone_detector]
  - id: format
    name: "格式规范"
    weight: 0.10
    agents: [format_compliance]
  - id: logic
    name: "逻辑一致性"
    weight: 0.15
    agents: [logic_consistency]
  - id: innovation
    name: "创新性"
    weight: 0.20
    agents: [innovation_reviewer]
  - id: theory_depth
    name: "理论深度"
    weight: 0.07
    agents: [theory_depth_reviewer]
  - id: methodology
    name: "方法严谨性"
    weight: 0.10
    agents: [methodology_reviewer]
  - id: reference_quality
    name: "参考文献质量"
    weight: 0.05
    agents: [reference_quality]
  - id: factual_accuracy
    name: "事实准确性"
    weight: 0
    scoreless: true
    agents: [factual_accuracy]
  - id: ethics
    name: "伦理合规"
    weight: 0
    scoreless: true
    agents: [ethics_reviewer]
grade_thresholds:
  优: 85
  良: 70
  中: 55
  差: 0
gate_blockers:
  - logic_contradiction
  - plagiarism_risk_high
  - pervasive_ai_tone
  - insufficient_innovation
  - methodology_fatal
  - missing_core_section
  - factual_error

coupling_rules:
  - source: ai_tone
    targets: [content, logic]
    type: clamp_max
    base_cap: 30
    release_rate: 0.020

  - sources: [format, content]
    type: divergence_penalty
    condition:
      min_divergence: 25
      target_max_for_penalty: 60
    penalty_factor: 0.3
    max_penalty: 10
    target: content

  - sources: [ai_tone, innovation]
    target: innovation
    type: dynamic_weight
    default_weight: 0.20
    mapping:
      - condition: "ai_tone >= 70 && innovation >= 70"
        weight: 0.30
        borrow_from:
          content: -0.05
          structure: -0.05
      - condition: "ai_tone < 40"
        weight: 0.10
        give_to:
          format: 0.05
          methodology: 0.05

ai_tone_curves:
  # Positive signals: HIGH density → AI (sigmoid)
  benwen:       {weight: 25, curve: sigmoid, inflection: 13, steepness: 0.3}
  gaix:         {weight: 10, curve: sigmoid, inflection: 12, steepness: 0.25, stem: {inflection: 18}}
  danshi:       {weight: 8,  curve: sigmoid, inflection: 10, steepness: 0.3}
  suizhe:       {weight: 8,  curve: sigmoid, inflection: 4,  steepness: 0.5}
  ba:           {weight: 10, curve: sigmoid, inflection: 6,  steepness: 0.3}
  jinxing:      {weight: 15, curve: sigmoid, inflection: 15, steepness: 0.25, stem: {inflection: 25}}
  # Negative signals: ZERO/LOW density → AI (inverted sigmoid)
  yinci:        {weight: 8,  curve: inverted_sigmoid, inflection: 3,  steepness: 0.5}
  tongguo:      {weight: 8,  curve: inverted_sigmoid, inflection: 5,  steepness: 0.3}

ai_fusion:
  agreement_threshold: 0.5
  disagree_shrink: 0.3
  low_signal_shrink: 0.4
  script_keys:
    - bei_density
    - zai_construction_density
    - tongguo_density
    - bujin_density
    - cong_perspective_density
    - juyou_density
    - conger_density
    - chengwei_density
  thresholds:
    bei_density: 7.3
    zai_construction_density: 49.9
    tongguo_density: 27.7
    bujin_density: 14.1
    cong_perspective_density: 4.3
    juyou_density: 7.2
    conger_density: 2.6
    chengwei_density: 3.6

length_limits:
  min: 30000
  max: 80000
  too_short_penalty: 0.005
  too_long_penalty: 0.001
