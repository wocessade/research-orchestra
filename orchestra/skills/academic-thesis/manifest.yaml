  thesis-inflated: [T1, T2, T3, T4, T5, T6, T6.7, T7]
  thesis-master: [T1, T2, T3, T4, T5, T6, T6.5, T7]
  thesis-master-inflated: [T1, T2, T3, T4, T5, T6, T6.5, T6.7, T7]
  thesis-with-data: [T1, T1.5, T2, T3, T4, T5, T6, T7]
  thesis-with-data-inflated: [T1, T1.5, T2, T3, T4, T5, T6, T6.7, T7]
  thesis-master-with-data: [T1, T1.5, T2, T3, T4, T5, T6, T6.5, T7]
  thesis-master-with-data-inflated: [T1, T1.5, T2, T3, T4, T5, T6, T6.5, T6.7, T7]
  existing-manuscript: [T5, T6]
  existing-manuscript-defense: [T5, T6, T7]
  existing-manuscript-inflated: [T5, T6, T6.7]
  existing-manuscript-master: [T5, T6, T6.5]
  existing-manuscript-master-defense: [T5, T6, T6.5, T7]
  existing-manuscript-master-inflated: [T5, T6, T6.5, T6.7]

