<!DOCTYPE html>
<html lang="zh-CN" data-theme="academic-clean">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献周报</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ===== CSS Variables — Theme Injection Point ===== */
:root {
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --chart-1: #2563eb;
  --chart-2: #0891b2;
  --chart-3: #7c3aed;
  --chart-4: #ea580c;
  --chart-5: #059669;
  --badge-A: #166534;
  --badge-A-bg: #dcfce7;
  --badge-B: #1e40af;
  --badge-B-bg: #dbeafe;
  --badge-C: #92400e;
  --badge-C-bg: #fef3c7;
  --badge-D: #6b21a8;
  --badge-D-bg: #f3e8ff;
  --badge-E: #9ca3af;
  --badge-E-bg: #f3f4f6;
  --sidebar-bg: #1e293b;
  --sidebar-text: #cbd5e1;
  --sidebar-active: #2563eb;
}

/* Theme 2: warm-amber */
[data-theme="warm-amber"] {
  --bg: #fffbeb; --bg-card: #ffffff; --text: #1c1917; --text-secondary: #78716c;
  --border: #e7d4b8; --accent: #d97706; --accent-light: #fef3c7;
  --chart-1: #d97706; --chart-2: #dc2626; --chart-3: #7c2d12; --chart-4: #b45309; --chart-5: #92400e;
  --sidebar-bg: #292524; --sidebar-text: #d6d3d1; --sidebar-active: #d97706;
}

/* Theme 3: forest-green */
[data-theme="forest-green"] {
  --bg: #f0fdf4; --bg-card: #ffffff; --text: #052e16; --text-secondary: #4b5563;
  --border: #bbf7d0; --accent: #059669; --accent-light: #d1fae5;
  --chart-1: #059669; --chart-2: #16a34a; --chart-3: #0284c7; --chart-4: #d97706; --chart-5: #7c3aed;
  --sidebar-bg: #064e3b; --sidebar-text: #a7f3d0; --sidebar-active: #059669;
}

/* Theme 4: dark-slate */
[data-theme="dark-slate"] {
  --bg: #0f172a; --bg-card: #1e293b; --text: #e2e8f0; --text-secondary: #94a3b8;
  --border: #334155; --accent: #38bdf8; --accent-light: #0c2d48;
  --chart-1: #38bdf8; --chart-2: #818cf8; --chart-3: #f472b6; --chart-4: #fbbf24; --chart-5: #34d399;
  --badge-A: #4ade80; --badge-A-bg: #052e16; --badge-B: #60a5fa; --badge-B-bg: #172554;
  --badge-C: #facc15; --badge-C-bg: #422006; --badge-D: #c084fc; --badge-D-bg: #2e1065; --badge-E: #9ca3af; --badge-E-bg: #1f2937;
  --sidebar-bg: #020617; --sidebar-text: #94a3b8; --sidebar-active: #38bdf8;
}

/* Theme 5: deep-teal */
[data-theme="deep-teal"] {
  --bg: #042f2e; --bg-card: #115e59; --text: #ccfbf1; --text-secondary: #5eead4;
  --border: #0d9488; --accent: #2dd4bf; --accent-light: #134e4a;
  --chart-1: #2dd4bf; --chart-2: #fbbf24; --chart-3: #f472b6; --chart-4: #818cf8; --chart-5: #fb923c;
  --badge-A: #4ade80; --badge-A-bg: #052e16; --badge-B: #60a5fa; --badge-B-bg: #172554;
  --badge-C: #facc15; --badge-C-bg: #422006; --badge-D: #c084fc; --badge-D-bg: #2e1065; --badge-E: #9ca3af; --badge-E-bg: #1f2937;
  --sidebar-bg: #022c22; --sidebar-text: #5eead4; --sidebar-active: #2dd4bf;
}

/* Theme 6: midnight-plum */
[data-theme="midnight-plum"] {
  --bg: #1a0a2e; --bg-card: #2d1b4e; --text: #f3e8ff; --text-secondary: #c4b5fd;
  --border: #4c1d95; --accent: #a78bfa; --accent-light: #3b0764;
  --chart-1: #a78bfa; --chart-2: #f472b6; --chart-3: #38bdf8; --chart-4: #fbbf24; --chart-5: #34d399;
  --badge-A: #4ade80; --badge-A-bg: #052e16; --badge-B: #60a5fa; --badge-B-bg: #172554;
  --badge-C: #facc15; --badge-C-bg: #422006; --badge-D: #c084fc; --badge-D-bg: #2e1065; --badge-E: #9ca3af; --badge-E-bg: #1f2937;
  --sidebar-bg: #0d0520; --sidebar-text: #c4b5fd; --sidebar-active: #a78bfa;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 15px; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh; line-height: 1.7;
}

/* ===== Sidebar ===== */
#sidebar {
  position: fixed; top: 0; left: 0; width: 210px; height: 100vh;
  background: var(--sidebar-bg); color: var(--sidebar-text);
  padding: 24px 16px; overflow-y: auto; z-index: 100;
  transition: transform 0.3s;
}
.sidebar-title {
  font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;
  padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.12);
  color: #fff;
}
#sidebar ul { list-style: none; }
#sidebar li { margin-bottom: 2px; }
#sidebar a {
  display: block; padding: 7px 12px; border-radius: 6px;
  color: var(--sidebar-text); text-decoration: none; font-size: 0.88rem;
  transition: background 0.15s, color 0.15s;
}
#sidebar a:hover { background: rgba(255,255,255,0.08); color: #fff; }
#sidebar a.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }

/* ===== Main ===== */
main { margin-left: 210px; flex: 1; padding: 40px 48px; max-width: 1100px; }

/* ===== Sections ===== */
section { margin-bottom: 48px; scroll-margin-top: 24px; }
section h2 {
  font-size: 1.5rem; font-weight: 700; margin-bottom: 20px;
  padding-bottom: 10px; border-bottom: 2px solid var(--accent);
}
section h3 { font-size: 1.15rem; font-weight: 600; margin: 16px 0 10px; }

/* ===== Cover ===== */
#cover {
  text-align: center; padding: 60px 0 40px;
  border-bottom: 1px solid var(--border);
}
#cover .week-label { font-size: 0.9rem; color: var(--text-secondary); letter-spacing: 1px; text-transform: uppercase; }
#cover h1 { font-size: 2.4rem; font-weight: 800; margin: 8px 0; }
#cover .date-range { font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 28px; }
#cover .cover-stats { display: flex; justify-content: center; gap: 36px; flex-wrap: wrap; margin: 28px 0; }
#cover .cover-stat { text-align: center; }
#cover .cover-stat .num { font-size: 2rem; font-weight: 800; color: var(--accent); }
#cover .cover-stat .lbl { font-size: 0.8rem; color: var(--text-secondary); }

/* ===== Stat Cards ===== */
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px; text-align: center;
}
.stat-card .num { font-size: 2rem; font-weight: 800; color: var(--accent); }
.stat-card .lbl { font-size: 0.82rem; color: var(--text-secondary); margin-top: 4px; }

/* ===== Charts Row ===== */
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.chart-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
}
.chart-box h3 { margin-top: 0; margin-bottom: 12px; font-size: 0.95rem; color: var(--text-secondary); }
.chart-box canvas { max-height: 280px; }

/* ===== Paper Table ===== */
#paper-table {
  width: 100%; border-collapse: collapse; font-size: 0.9rem;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
#paper-table thead { background: var(--accent-light); }
#paper-table th {
  padding: 12px 14px; text-align: left; font-weight: 600; font-size: 0.82rem;
  color: var(--text-secondary); cursor: pointer; user-select: none; white-space: nowrap;
}
#paper-table th:hover { color: var(--accent); }
#paper-table td { padding: 10px 14px; border-top: 1px solid var(--border); }
#paper-table tbody tr:hover { background: var(--accent-light); }
#paper-table .title-col { max-width: 320px; }
#paper-table .score-col { font-weight: 700; text-align: center; }

/* Badges */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.75rem; font-weight: 600;
}
.badge-A { color: var(--badge-A); background: var(--badge-A-bg); }
.badge-B { color: var(--badge-B); background: var(--badge-B-bg); }
.badge-C { color: var(--badge-C); background: var(--badge-C-bg); }
.badge-D { color: var(--badge-D); background: var(--badge-D-bg); }
.badge-E { color: var(--badge-E); background: var(--badge-E-bg); }
.badge-pending {
  color: #92400e; background: #fef3c7; border: 1px solid #f59e0b;
}

/* ===== A-Paper Cards ===== */
.a-paper-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 4px solid var(--accent); border-radius: 8px;
  padding: 22px; margin-bottom: 18px;
}
.a-paper-card .card-header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.a-paper-card .card-header h3 { margin: 0; font-size: 1.1rem; flex: 1; }
.a-paper-card .field {
  padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid var(--border);
}
.a-paper-card .field:last-child { border-bottom: none; }
.a-paper-card .field strong { color: var(--accent); margin-right: 6px; }
.todo-connection { color: var(--text-secondary); font-style: italic; font-size: 0.82rem; }

/* ===== Comparison Tables ===== */
.comparison-table {
  width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 20px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
.comparison-table th {
  background: var(--accent-light); padding: 10px 12px; text-align: left;
  font-weight: 600; font-size: 0.8rem; white-space: nowrap;
}
.comparison-table td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }

/* ===== Critique ===== */
.critique-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.critique-cat {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
}
.critique-cat h4 { font-size: 0.88rem; margin-bottom: 6px; color: var(--accent); }
.critique-cat ul { list-style: disc; padding-left: 18px; font-size: 0.85rem; color: var(--text-secondary); }
.critique-cat li { margin-bottom: 3px; }
.empty-critique { color: var(--text-secondary); font-style: italic; }

/* ===== Next Steps ===== */
.next-checklist { list-style: none; }
.next-checklist li {
  padding: 8px 12px; margin-bottom: 6px; border-radius: 6px;
  background: var(--bg-card); border: 1px solid var(--border);
  font-size: 0.9rem;
}
.next-checklist input { margin-right: 10px; accent-color: var(--accent); }

/* ===== Tag Cloud ===== */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.tag-chip {
  padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 500;
  background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent);
}

/* ===== Placeholder text ===== */
.placeholder-text { color: var(--text-secondary); font-style: italic; padding: 20px; text-align: center; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  #sidebar {
    position: relative; width: 100%; height: auto; padding: 10px;
  }
  #sidebar ul { display: flex; flex-wrap: wrap; gap: 2px; }
  #sidebar li { margin-bottom: 0; }
  main { margin-left: 0; padding: 20px; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
  .critique-grid { grid-template-columns: 1fr; }
  #cover h1 { font-size: 1.6rem; }
}

/* ===== Print ===== */
@media print {
  #sidebar { display: none; }
  main { margin-left: 0; padding: 0; max-width: 100%; }
  section { page-break-inside: avoid; margin-bottom: 24px; }
  canvas { max-width: 100% !important; }
  .comparison-table { font-size: 0.75rem; }
  body { font-size: 12pt; color: #000; background: #fff; }
}
</style>
</head>
<body>

<nav id="sidebar">
  <div class="sidebar-title" id="sidebar-week-label"></div>
  <ul>
    <li><a href="#cover">封面</a></li>
    <li><a href="#overview">本周概览</a></li>
    <li><a href="#table">文献总表</a></li>
    <li><a href="#a-papers">A类重点论文</a></li>
    <li><a href="#comparison">跨论文对比</a></li>
    <li><a href="#clusters">主题聚类</a></li>
    <li><a href="#critique">批判与空白</a></li>
    <li><a href="#next-week">下周计划</a></li>
  </ul>
</nav>

<main>
  <section id="cover"></section>
  <section id="overview"></section>
  <section id="table"></section>
  <section id="a-papers"></section>
  <section id="comparison"></section>
  <section id="clusters"></section>
  <section id="critique"></section>
  <section id="next-week"></section>
</main>

<script id="weekly-data" type="application/json">WEEKLY_DATA_PLACEHOLDER</script>

<script>
// ===== Parse Data =====
const data = JSON.parse(document.getElementById('weekly-data').textContent);
const { meta, stats, papers, cross_paper, theme_clusters, critique_synthesis } = data;

// Set page title
document.title = meta.year + '年 第' + meta.week + '周 文献周报';
document.getElementById('sidebar-week-label').textContent = meta.year + '-W' + String(meta.week).padStart(2,'0');

// Helpers
const clsLabel = { 'A_核心主线':'A', 'B_章节支撑':'B', 'C_工程背景':'C', 'D_方法借鉴':'D', 'E_暂存低优先':'E' };
const clsFull = { 'A_核心主线':'A_核心主线', 'B_章节支撑':'B_章节支撑', 'C_工程背景':'C_工程背景', 'D_方法借鉴':'D_方法借鉴', 'E_暂存低优先':'E_暂存低优先' };
function isPlaceholder(text) { return !text || text === '-' || /^\[待/.test(text); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ===== Section ① Cover =====
(function renderCover() {
  const sec = document.getElementById('cover');
  if (stats.total === 0) {
    sec.innerHTML = '<div class="week-label">' + meta.year + '年 第' + meta.week + '周</div>' +
      '<h1>本周无新文献推送</h1>' +
      '<p class="placeholder-text">' + meta.monday + ' — ' + meta.sunday + ' 期间暂无文献推送记录</p>';
    return;
  }
  sec.innerHTML =
    '<div class="week-label">' + meta.year + '年 第' + meta.week + '周</div>' +
    '<h1>文献研究周报</h1>' +
    '<div class="date-range">' + meta.monday + ' — ' + meta.sunday + '</div>' +
    '<div class="cover-stats">' +
      '<div class="cover-stat"><div class="num">' + stats.total + '</div><div class="lbl">论文</div></div>' +
      '<div class="cover-stat"><div class="num">' + stats.avg_score + '</div><div class="lbl">均分</div></div>' +
      '<div class="cover-stat"><div class="num">' + stats.A_count + '</div><div class="lbl">A类</div></div>' +
    '</div>' +
    '<div class="chart-box" style="max-width:500px;margin:0 auto;"><canvas id="chart-cover-score"></canvas></div>';
})();

// ===== Section ② Overview =====
(function renderOverview() {
  const sec = document.getElementById('overview');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>本周概览</h2><p class="placeholder-text">本周无数据</p>';
    return;
  }
  let html = '<h2>本周概览</h2>' +
    '<div class="stat-cards">' +
      '<div class="stat-card"><div class="num">' + stats.total + '</div><div class="lbl">总论文</div></div>' +
      '<div class="stat-card"><div class="num">' + stats.avg_score + '</div><div class="lbl">平均分</div></div>' +
      '<div class="stat-card"><div class="num">' + stats.median_score + '</div><div class="lbl">中位数</div></div>' +
      '<div class="stat-card"><div class="num">' + stats.A_count + '</div><div class="lbl">A 类</div></div>' +
    '</div>';

  // Last week comparison
  if (data.last_week) {
    const lw = data.last_week;
    const totalDelta = stats.total - (lw.total || 0);
    const avgDelta = (stats.avg_score - (lw.avg_score || 0)).toFixed(1);
    html += '<div style="display:flex;gap:12px;margin-bottom:24px;font-size:0.82rem;color:var(--text-secondary);">' +
      '<span>vs 上周: 论文 ' + (totalDelta >= 0 ? '+' : '') + totalDelta + ' 篇</span>' +
      '<span>均分 ' + (avgDelta >= 0 ? '+' : '') + avgDelta + '</span>' +
      '</div>';
  }

  html += '<div class="charts-row">' +
      '<div class="chart-box"><h3>分数分布</h3><canvas id="chart-score-dist"></canvas></div>' +
      '<div class="chart-box"><h3>分类分布</h3><canvas id="chart-class-dist"></canvas></div>' +
    '</div>';
  sec.innerHTML = html;
})();

// ===== Section ③ Paper Table =====
(function renderTable() {
  const sec = document.getElementById('table');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>文献总表</h2><p class="placeholder-text">暂无文献</p>';
    return;
  }
  let rows = '';
  papers.forEach((p, i) => {
    const tags = (p.tags || []).map(t => '<span class="tag-chip" style="font-size:0.72rem;padding:1px 8px;">' + esc(t) + '</span>').join(' ');
    const pending = isPlaceholder(p.sections['批判'] || '') ? ' <span class="badge badge-pending">待精读</span>' : '';
    const action = p.action ? ' <span class="badge badge-' + (p.action==='精读'?'A':p.action==='略读'?'C':'E') + '">' + esc(p.action) + '</span>' : '';
    const obsidianUri = 'obsidian://open?vault=MD%20ideas&file=' + encodeURIComponent('20-机器学习/文献/每日推送/' + (p.date_dir||'') + '/' + (p.filename||''));
    rows += '<tr data-idx="' + i + '">' +
      '<td class="title-col" data-value="' + esc(p.title) + '">' + esc(p.title) + pending + action + '</td>' +
      '<td class="score-col" data-value="' + p.score + '">' + p.score + '</td>' +
      '<td data-value="' + esc(p.classification) + '"><span class="badge badge-' + clsLabel[p.classification] + '">' + clsFull[p.classification] + '</span></td>' +
      '<td>' + tags + '</td>' +
      '<td><a href="' + obsidianUri + '" class="obsidian-link" style="color:var(--accent);text-decoration:none;font-size:0.82rem;" title="在 Obsidian 中打开">笔记</a></td>' +
    '</tr>';
  });
  sec.innerHTML =
    '<h2>文献总表</h2>' +
    '<div style="overflow-x:auto;">' +
    '<table id="paper-table"><thead><tr>' +
      '<th data-sort="title">标题</th><th data-sort="score">评分</th><th data-sort="class">分类</th><th>标签</th><th>链接</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div>';
})();

// ===== Section ④ A-Class Papers =====
(function renderAPapers() {
  const sec = document.getElementById('a-papers');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>A类重点论文</h2><p class="placeholder-text">暂无数据</p>';
    return;
  }
  const aList = papers.filter(p => p.classification === 'A_核心主线');
  let cards = '';
  const displayList = aList.length > 0 ? aList : papers.slice(0, Math.min(3, papers.length));

  if (aList.length === 0) {
    sec.innerHTML = '<h2>A类重点论文（本周无）</h2>' +
      '<p class="placeholder-text">本周论文无 A_核心主线 分类。以下为本周最高分论文：</p>' +
      '<div id="a-cards-container"></div>';
  } else {
    sec.innerHTML = '<h2>A类重点论文</h2><div id="a-cards-container"></div>';
  }

  displayList.forEach(p => {
    const pending = isPlaceholder(p.sections['批判'] || '') ? ' <span class="badge badge-pending">待精读</span>' : '';
    const actionBadge = p.action ? ' <span class="badge badge-' + (p.action==='精读'?'A':p.action==='略读'?'C':'E') + '" style="font-size:0.75rem;">' + esc(p.action) + '</span>' : '';
    cards += '<div class="a-paper-card">' +
      '<div class="card-header">' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<span class="badge badge-' + clsLabel[p.classification] + '">' + clsFull[p.classification] + '</span>' +
        '<span>⭐ ' + p.score + '</span>' + pending + actionBadge +
      '</div>' +
      '<div class="card-body">' +
        '<div class="field"><strong>核心主张</strong>' + esc(p.sections['核心主张'] || '—') + '</div>' +
        '<div class="field"><strong>方法</strong>' + esc(p.sections['方法'] || '—') + '</div>' +
        '<div class="field"><strong>关键发现</strong>' + esc(p.sections['关键发现'] || '—') + '</div>' +
        (p.discussion ? '<div class="field"><strong>我的判断</strong>' + esc(p.discussion) + '</div>' : '') +
        '<div class="field"><strong>Connection to Research</strong><span class="todo-connection"> 待补充</span></div>' +
        '<div class="field"><strong>下一步</strong>' + esc(p.sections['下一步'] || '—') + '</div>' +
      '</div></div>';
  });
  document.getElementById('a-cards-container').innerHTML = cards;
})();

// ===== Section ⑤ Cross-Paper Comparison =====
(function renderComparison() {
  const sec = document.getElementById('comparison');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>跨论文对比</h2><p class="placeholder-text">暂无数据</p>';
    return;
  }
  if (stats.total < 2) {
    let html = '<h2>跨论文对比</h2>';
    if (cross_paper && cross_paper.user_insights) {
      html += '<div class="a-paper-card" style="border-left-color:var(--chart-3);margin-bottom:20px;">' +
        '<div class="field"><strong>用户洞察</strong>' + esc(cross_paper.user_insights) + '</div></div>';
    }
    html += '<div class="placeholder-text">本周仅收录 1 篇论文，跨论文对比暂不适用</div>';
    sec.innerHTML = html;
    return;
  }
  if (!cross_paper) {
    sec.innerHTML = '<h2>跨论文对比</h2><div class="placeholder-text">跨论文分析待 agent 生成</div>';
    return;
  }

  let html = '<h2>跨论文对比</h2>';

  if (cross_paper.user_insights) {
    html += '<div class="a-paper-card" style="border-left-color:var(--chart-3);margin-bottom:20px;">' +
      '<div class="field"><strong>用户洞察</strong>' + esc(cross_paper.user_insights) + '</div>' +
      '</div>';
  }

  if (cross_paper.method_comparison && cross_paper.method_comparison.length > 0) {
    html += '<h3>方法对比</h3><table class="comparison-table"><thead><tr>';
    cross_paper.method_comparison[0].forEach(h => { html += '<th>' + esc(h) + '</th>'; });
    html += '</tr></thead><tbody>';
    for (let i = 1; i < cross_paper.method_comparison.length; i++) {
      html += '<tr>';
      cross_paper.method_comparison[i].forEach(c => { html += '<td>' + esc(c) + '</td>'; });
      html += '</tr>';
    }
    html += '</tbody></table>';
  }

  if (cross_paper.metrics_comparison && cross_paper.metrics_comparison.length > 0) {
    html += '<h3>指标对比</h3><table class="comparison-table"><thead><tr>';
    cross_paper.metrics_comparison[0].forEach(h => { html += '<th>' + esc(h) + '</th>'; });
    html += '</tr></thead><tbody>';
    for (let i = 1; i < cross_paper.metrics_comparison.length; i++) {
      html += '<tr>';
      cross_paper.metrics_comparison[i].forEach(c => { html += '<td>' + esc(c) + '</td>'; });
      html += '</tr>';
    }
    html += '</tbody></table>';
  }

  sec.innerHTML = html;
})();

// ===== Section ⑥ Theme Clusters =====
(function renderClusters() {
  const sec = document.getElementById('clusters');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>主题聚类</h2><p class="placeholder-text">暂无数据</p>';
    return;
  }

  let html = '<h2>主题聚类</h2>';

  // Tag frequency tags
  if (stats.tag_frequency && stats.tag_frequency.length > 0) {
    html += '<div class="tag-cloud">';
    stats.tag_frequency.forEach(([tag, count]) => {
      html += '<span class="tag-chip">' + esc(tag) + ' ×' + count + '</span>';
    });
    html += '</div>';
    html += '<div class="chart-box"><h3>标签频率 Top 15</h3><canvas id="chart-tags"></canvas></div>';
  }

  // Theme clusters text
  if (theme_clusters) {
    html += '<h3>主题分组</h3>';
    html += '<div style="font-size:0.9rem;line-height:1.8;">' + theme_clusters.replace(/\n/g, '<br>') + '</div>';
  }

  sec.innerHTML = html;
})();

// ===== Section ⑦ Critique & Gaps =====
(function renderCritique() {
  const sec = document.getElementById('critique');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>批判与空白</h2><p class="placeholder-text">暂无数据</p>';
    return;
  }

  const categories = critique_synthesis || {};
  const catNames = ['代码/复现', '数据/评估', '泛化', '规模', '理论', '其他'];
  const catKeys = ['code', 'data', 'generalization', 'scale', 'theory', 'other'];

  let html = '<h2>批判与空白</h2><div class="critique-grid">';
  catKeys.forEach((key, i) => {
    const items = categories[key] || [];
    html += '<div class="critique-cat"><h4>' + catNames[i] + '</h4>';
    if (items.length === 0) {
      html += '<ul><li class="empty-critique">暂无</li></ul>';
    } else {
      html += '<ul>';
      items.forEach(item => { html += '<li>' + esc(item) + '</li>'; });
      html += '</ul>';
    }
    html += '</div>';
  });
  html += '</div>';

  // Check if all critiques are placeholders
  const allPending = papers.every(p => isPlaceholder(p.sections['批判'] || ''));
  if (allPending) {
    html += '<p class="placeholder-text" style="margin-top:16px;">所有论文尚未精读，批判与空白分析待补充</p>';
  }

  sec.innerHTML = html;
})();

// ===== Section ⑧ Next Week Plan =====
(function renderNextWeek() {
  const sec = document.getElementById('next-week');
  if (stats.total === 0) {
    sec.innerHTML = '<h2>下周计划</h2><p class="placeholder-text">暂无数据</p>';
    return;
  }

  // Aggregate 下一步 from all papers
  const steps = [];
  papers.forEach(p => {
    const text = p.sections['下一步'] || '';
    if (text && !isPlaceholder(text)) {
      text.split('\n').forEach(line => {
        const cleaned = line.replace(/^[-*]\s*\[ \]\s*/, '').trim();
        if (cleaned && !steps.includes(cleaned)) steps.push(cleaned);
      });
    }
  });

  let html = '<h2>下周计划</h2>';
  if (steps.length === 0) {
    html += '<p class="placeholder-text">暂无明确的下一步行动项</p>';
  } else {
    html += '<ul class="next-checklist">';
    steps.forEach(s => { html += '<li><input type="checkbox"> ' + esc(s) + '</li>'; });
    html += '</ul>';
  }
  sec.innerHTML = html;
})();

// ===== Charts =====
const style = getComputedStyle(document.documentElement);
const chartColors = [
  style.getPropertyValue('--chart-1').trim(),
  style.getPropertyValue('--chart-2').trim(),
  style.getPropertyValue('--chart-3').trim(),
  style.getPropertyValue('--chart-4').trim(),
  style.getPropertyValue('--chart-5').trim(),
];
const textSecondary = style.getPropertyValue('--text-secondary').trim();
const borderColor = style.getPropertyValue('--border').trim();

Chart.defaults.color = textSecondary;
Chart.defaults.borderColor = borderColor;
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

function makeScoreChart(canvasId) {
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const sd = stats.score_distribution || {};
  return new Chart(el, {
    type: 'bar',
    data: {
      labels: ['0-5', '5-6', '6-7', '7-8', '8-10'],
      datasets: [{
        label: '论文数',
        data: [sd['0-5']||0, sd['5-6']||0, sd['6-7']||0, sd['7-8']||0, sd['8-10']||0],
        backgroundColor: chartColors,
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } },
        x: { grid: { display: false } }
      }
    }
  });
}

function makeClassChart(canvasId) {
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const cd = stats.classification_distribution || {};
  const labels = ['A_核心主线', 'B_章节支撑', 'C_工程背景', 'D_方法借鉴', 'E_暂存低优先'];
  return new Chart(el, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: labels.map(l => cd[l] || 0),
        backgroundColor: [
          style.getPropertyValue('--badge-A-bg').trim(),
          style.getPropertyValue('--badge-B-bg').trim(),
          style.getPropertyValue('--badge-C-bg').trim(),
          style.getPropertyValue('--badge-D-bg').trim(),
          style.getPropertyValue('--badge-E-bg').trim(),
        ],
        borderColor: [
          style.getPropertyValue('--badge-A').trim(),
          style.getPropertyValue('--badge-B').trim(),
          style.getPropertyValue('--badge-C').trim(),
          style.getPropertyValue('--badge-D').trim(),
          style.getPropertyValue('--badge-E').trim(),
        ],
        borderWidth: 2,
      }]
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true } } }
    }
  });
}

function makeTagChart(canvasId) {
  const el = document.getElementById(canvasId);
  if (!el) return null;
  const tf = stats.tag_frequency || [];
  return new Chart(el, {
    type: 'bar',
    data: {
      labels: tf.map(t => t[0]),
      datasets: [{
        label: '出现次数',
        data: tf.map(t => t[1]),
        backgroundColor: chartColors[0],
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { stepSize: 1 } },
        y: { grid: { display: false } }
      }
    }
  });
}

// Init
makeScoreChart('chart-cover-score');
makeScoreChart('chart-score-dist');
makeClassChart('chart-class-dist');
makeTagChart('chart-tags');

// ===== Table Sorting =====
document.querySelectorAll('#paper-table th[data-sort]').forEach(th => {
  th.addEventListener('click', function() {
    const col = this.dataset.sort;
    const tbody = this.closest('table').querySelector('tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const isAsc = this.classList.contains('asc');
    // Reset all headers
    document.querySelectorAll('#paper-table th').forEach(h => h.classList.remove('asc', 'desc'));
    this.classList.add(isAsc ? 'desc' : 'asc');

    rows.sort((a, b) => {
      let va = a.cells[col === 'title' ? 0 : col === 'score' ? 1 : 2].dataset.value || '';
      let vb = b.cells[col === 'title' ? 0 : col === 'score' ? 1 : 2].dataset.value || '';
      // Numeric sort for score
      if (col === 'score') {
        return isAsc ? parseFloat(vb) - parseFloat(va) : parseFloat(va) - parseFloat(vb);
      }
      // String sort
      return isAsc ? vb.localeCompare(va, 'zh-CN') : va.localeCompare(vb, 'zh-CN');
    });
    rows.forEach(r => tbody.appendChild(r));
  });
});

// ===== Sidebar IntersectionObserver =====
const sections = document.querySelectorAll('main section[id]');
const navLinks = document.querySelectorAll('#sidebar a');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      navLinks.forEach(a => a.classList.remove('active'));
      const link = document.querySelector('#sidebar a[href="#' + entry.target.id + '"]');
      if (link) link.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });
sections.forEach(s => observer.observe(s));
</script>
